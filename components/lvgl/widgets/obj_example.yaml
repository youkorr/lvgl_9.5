# Principe : sur l'evenement on_pressing, on recupere le vecteur de
# deplacement du dernier rafraichissement de l'input device et on ajoute
# ce delta a la position courante de l'objet pour le deplacer.

lvgl:
  displays:
    - display_id: my_display
      pages:

        # ----------------------------------------------------------------
        # Exemple 1 : obj "simple" (equivalent de lv_example_obj_1)
        # Conteneur basique avec un label centre a l'interieur
        # ----------------------------------------------------------------
        - id: obj_basic_page
          widgets:
            - obj:
                id: basic_obj
                x: CENTER
                y: CENTER
                width: 200
                height: 120
                bg_color: 0x2196F3
                bg_opa: COVER
                border_width: 2
                border_color: 0xFFFFFF
                radius: 10
                pad_all: 10
                widgets:
                  - label:
                      align: CENTER
                      text: "Hello LVGL"
                      text_color: 0xFFFFFF

        # ----------------------------------------------------------------
        # Exemple 2 : objet draggable (portage de lv_example_obj_2.c)
        # L'utilisateur peut deplacer l'objet a l'ecran en glissant
        # ----------------------------------------------------------------
        - id: obj_drag_page
          widgets:

            # Petit titre pour guider l'utilisateur
            - label:
                align: TOP_MID
                y: 10
                text: "Drag the blue box"
                text_color: 0x000000

            # Objet deplacable
            - obj:
                id: drag_obj
                x: 50
                y: 80
                width: 150
                height: 100
                bg_color: 0x2196F3
                bg_opa: COVER
                border_width: 2
                border_color: 0x0D47A1
                radius: 8
                # Indispensable : rendre l'objet cliquable/pressable
                clickable: true
                # Equivalent de : lv_obj_add_event_cb(obj, drag_event_handler,
                #                                     LV_EVENT_PRESSING, NULL);
                on_pressing:
                  - lambda: |-
                      // Recupere l'input device actif (touch, souris, etc.)
                      lv_indev_t * indev = lv_indev_active();
                      if (indev == NULL) return;

                      // Vecteur de deplacement depuis le dernier refresh
                      lv_point_t vect;
                      lv_indev_get_vect(indev, &vect);

                      // Nouvelle position = position actuelle + delta
                      lv_obj_t * target = id(drag_obj)->obj;
                      int32_t x = lv_obj_get_x_aligned(target) + vect.x;
                      int32_t y = lv_obj_get_y_aligned(target) + vect.y;
                      lv_obj_set_pos(target, x, y);
                widgets:
                  - label:
                      align: CENTER
                      text: "Drag me"
                      text_color: 0xFFFFFF

        # ----------------------------------------------------------------
        # Exemple 3 : plusieurs objets draggables independants
        # Montre comment reutiliser le meme pattern sur plusieurs widgets
        # ----------------------------------------------------------------
        - id: obj_multi_drag_page
          widgets:
            - label:
                align: TOP_MID
                y: 10
                text: "Drag any box"
                text_color: 0x000000

            - obj:
                id: drag_box_a
                x: 20
                y: 60
                width: 100
                height: 80
                bg_color: 0xE91E63
                bg_opa: COVER
                radius: 6
                clickable: true
                on_pressing:
                  - lambda: |-
                      lv_indev_t * indev = lv_indev_active();
                      if (indev == NULL) return;
                      lv_point_t v;
                      lv_indev_get_vect(indev, &v);
                      lv_obj_t * t = id(drag_box_a)->obj;
                      lv_obj_set_pos(t,
                          lv_obj_get_x_aligned(t) + v.x,
                          lv_obj_get_y_aligned(t) + v.y);
                widgets:
                  - label:
                      align: CENTER
                      text: "A"
                      text_color: 0xFFFFFF

            - obj:
                id: drag_box_b
                x: 150
                y: 60
                width: 100
                height: 80
                bg_color: 0x4CAF50
                bg_opa: COVER
                radius: 6
                clickable: true
                on_pressing:
                  - lambda: |-
                      lv_indev_t * indev = lv_indev_active();
                      if (indev == NULL) return;
                      lv_point_t v;
                      lv_indev_get_vect(indev, &v);
                      lv_obj_t * t = id(drag_box_b)->obj;
                      lv_obj_set_pos(t,
                          lv_obj_get_x_aligned(t) + v.x,
                          lv_obj_get_y_aligned(t) + v.y);
                widgets:
                  - label:
                      align: CENTER
                      text: "B"
                      text_color: 0xFFFFFF
