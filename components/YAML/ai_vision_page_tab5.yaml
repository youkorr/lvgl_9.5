id: ai_vision_page
bg_color: 0x000000

# =============================================================================
# AI Vision Page - M5Stack Tab5 (1280x720) edition - FULLSCREEN ZERO-COPY
# -----------------------------------------------------------------------------
# Layout inspired by esp32_p4_eye factory_demo (app_ai_detect.cpp): the
# canvas covers the full display at the exact camera resolution so:
#   - lvgl_camera_display takes its zero-copy path (no PPA, no scaling)
#   - no overdraw / alpha blend (every widget on top is fully opaque)
#   - the camera frame is presented 1:1 with no software work
#
# This is the configuration that gave esp32_p4_eye factory_demo its 30 FPS.
# Tested with sensor at 1280x720 and display at native 1280x720 (or with
# `display: rotation: 270` flipping a 720x1280 panel into landscape).
#
# Required globals:
#   globals:
#     - id: ai_vision_mode
#       type: int
#       initial_value: '0'
#     - id: ai_vision_painter_active
#       type: bool
#       initial_value: 'false'
#     - id: ai_vision_paint_color
#       type: uint32_t
#       initial_value: '0xffffff'
#
# Required components: see lvgl_camera_display, face_detection,
# yolo11_detection, pedestrian_detection blocks in your tab5.yaml.
# =============================================================================

on_load:
  - lambda: |-
      ESP_LOGI("ai_vision", "AI Vision page loaded (1280x720 fullscreen)");
      id(ai_vision_mode) = 0;
      id(tab5_cam).start_streaming();
      auto canvas = id(ai_vision_canvas);
      if (canvas != nullptr) {
        id(camera_display).configure_canvas(canvas);
      }
      id(camera_display).set_enabled(true);

      // Default tab = Face. Pause the others so only one neural net runs.
      id(face_detect).set_draw_enabled(true);
      id(face_detect).set_detection_interval(5);
      id(yolo_detect).set_draw_enabled(false);
      id(yolo_detect).set_detection_interval(1000000);
      id(pedestrian_detect).set_draw_enabled(false);
      id(pedestrian_detect).set_detection_interval(1000000);

on_unload:
  - lambda: |-
      id(face_detect).set_detection_interval(1000000);
      id(yolo_detect).set_detection_interval(1000000);
      id(pedestrian_detect).set_detection_interval(1000000);
      ESP_LOGI("ai_vision", "AI Vision page unloaded - all detectors paused");

widgets:
  # -----------------------------------------------------------------------
  # 1) FULLSCREEN CANVAS (1280x720, exactly the camera native resolution).
  #    lvgl_camera_display detects camera_size == canvas_size and uses the
  #    zero-copy path. NO PPA, NO software scaling.
  # -----------------------------------------------------------------------
  - canvas:
      id: ai_vision_canvas
      x: 0
      y: 0
      width: 1280
      height: 720
      bg_color: 0x000000
      on_pressing:
        then:
          - lambda: |-
              if (!id(ai_vision_painter_active)) return;
              auto canvas = id(ai_vision_canvas);
              if (canvas == nullptr) return;
              lv_indev_t * indev = lv_indev_get_act();
              if (indev == nullptr) return;
              lv_point_t p;
              lv_indev_get_point(indev, &p);
              lv_area_t a;
              lv_obj_get_coords(canvas, &a);
              int32_t lx = p.x - a.x1;
              int32_t ly = p.y - a.y1;
              if (lx < 0 || ly < 0 || lx >= 1280 || ly >= 720) return;
              lv_color_t col = lv_color_hex(id(ai_vision_paint_color));
              for (int dy = -3; dy <= 3; dy++) {
                for (int dx = -3; dx <= 3; dx++) {
                  int32_t xx = lx + dx;
                  int32_t yy = ly + dy;
                  if (xx >= 0 && yy >= 0 && xx < 1280 && yy < 720) {
                    lv_canvas_set_px(canvas, xx, yy, col, LV_OPA_COVER);
                  }
                }
              }

  # -----------------------------------------------------------------------
  # 2) BOTTOM CONTROL BAR (1280x48, FULLY OPAQUE).
  #    Sits over the bottom 48 pixels of the camera image. No transparency
  #    so LVGL just overwrites those pixels - no alpha blend, no fps cost.
  #    All four mode buttons inline + the detected counter.
  # -----------------------------------------------------------------------
  - obj:
      x: 0
      y: 672              # 720 - 48
      width: 1280
      height: 48
      bg_color: 0x161b22
      bg_opa: COVER       # opaque - no alpha blending
      border_opa: TRANSP
      pad_all: 2
      layout:
        type: FLEX
        flex_flow: ROW
        flex_align_main: SPACE_EVENLY
        flex_align_cross: CENTER
      widgets:
        - button:
            id: ai_tab_face
            width: 200
            height: 40
            bg_color: 0x1f6feb
            bg_opa: COVER
            on_click:
              then:
                - lambda: |-
                    id(ai_vision_mode) = 0;
                    id(face_detect).set_draw_enabled(true);
                    id(face_detect).set_detection_interval(5);
                    id(yolo_detect).set_draw_enabled(false);
                    id(yolo_detect).set_detection_interval(1000000);
                    id(pedestrian_detect).set_draw_enabled(false);
                    id(pedestrian_detect).set_detection_interval(1000000);
                    id(ai_vision_painter_active) = false;
                    id(camera_display).set_enabled(true);
            widgets:
              - label: { align: CENTER, text: "Face", text_color: 0xffffff, text_font: montserrat_18 }
        - button:
            id: ai_tab_coco
            width: 200
            height: 40
            bg_color: 0x238636
            bg_opa: COVER
            on_click:
              then:
                - lambda: |-
                    id(ai_vision_mode) = 1;
                    id(face_detect).set_draw_enabled(false);
                    id(face_detect).set_detection_interval(1000000);
                    id(yolo_detect).set_draw_enabled(true);
                    id(yolo_detect).set_detection_interval(8);
                    id(pedestrian_detect).set_draw_enabled(false);
                    id(pedestrian_detect).set_detection_interval(1000000);
                    id(ai_vision_painter_active) = false;
                    id(camera_display).set_enabled(true);
            widgets:
              - label: { align: CENTER, text: "COCO", text_color: 0xffffff, text_font: montserrat_18 }
        - button:
            id: ai_tab_ped
            width: 200
            height: 40
            bg_color: 0xa371f7
            bg_opa: COVER
            on_click:
              then:
                - lambda: |-
                    id(ai_vision_mode) = 2;
                    id(face_detect).set_draw_enabled(false);
                    id(face_detect).set_detection_interval(1000000);
                    id(yolo_detect).set_draw_enabled(false);
                    id(yolo_detect).set_detection_interval(1000000);
                    id(pedestrian_detect).set_draw_enabled(true);
                    id(pedestrian_detect).set_detection_interval(4);
                    id(ai_vision_painter_active) = false;
                    id(camera_display).set_enabled(true);
            widgets:
              - label: { align: CENTER, text: "Pedestrian", text_color: 0xffffff, text_font: montserrat_18 }
        - button:
            id: ai_tab_paint
            width: 160
            height: 40
            bg_color: 0xdb6d28
            bg_opa: COVER
            on_click:
              then:
                - lambda: |-
                    id(ai_vision_mode) = 3;
                    id(face_detect).set_draw_enabled(false);
                    id(face_detect).set_detection_interval(1000000);
                    id(yolo_detect).set_draw_enabled(false);
                    id(yolo_detect).set_detection_interval(1000000);
                    id(pedestrian_detect).set_draw_enabled(false);
                    id(pedestrian_detect).set_detection_interval(1000000);
                    id(ai_vision_painter_active) = true;
                    id(camera_display).set_enabled(false);
                    auto cv = id(ai_vision_canvas);
                    if (cv != nullptr) {
                      lv_canvas_fill_bg(cv, lv_color_hex(0x000000), LV_OPA_COVER);
                    }
            widgets:
              - label: { align: CENTER, text: "Paint", text_color: 0xffffff, text_font: montserrat_18 }
        # Counter (visible always, updated by an interval at top level)
        - label:
            id: ai_vision_count
            text: "0"
            text_color: 0xffffff
            text_font: montserrat_24
        - button:
            width: 110
            height: 40
            bg_color: 0x6e7681
            bg_opa: COVER
            on_click:
              then:
                - lvgl.page.show: home_page
            widgets:
              - label: { align: CENTER, text: "Back", text_color: 0xffffff, text_font: montserrat_18 }
