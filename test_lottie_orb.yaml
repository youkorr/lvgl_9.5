esphome:
  name: lottie-test
  friendly_name: Lottie Test
  min_version: 2025.2.0
  platformio_options:
    board_build.flash_mode: dio


esp32:
  board: esp32-p4-evboard
  flash_size: 16MB
  framework:
    type: esp-idf
    version: 5.5.2
    platform_version: 55.03.35
    advanced:
      enable_idf_experimental_features: yes
    sdkconfig_options:
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_SPEED_200M: "y"
      CONFIG_SPIRAM_SPEED: "200"
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      CONFIG_ESP_TIMER_TASK_STACK_SIZE: "4096"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"


psram:
  speed: 200MHz


esp_ldo:
  - voltage: 2.5V
    channel: 3
  - voltage: 2.7V
    channel: 4


logger:
  level: INFO


external_components:
  - source:
      type: git
      url: https://github.com/youkorr/lvgl_9.5
      ref: claude/create-sphere-BVofQ
    components: [lvgl, image, thorvg]
    refresh: 0s


# ----------------------------------------------------------------------------
# Display — MIPI-DSI JC4880P443 (same as p4mini.yaml)
# ----------------------------------------------------------------------------
display:
  - platform: mipi_dsi
    id: main_display
    model: JC4880P443
    update_interval: never
    auto_clear_enabled: false
    rotation: 270
    dimensions:
      height: 800
      width: 480


# ----------------------------------------------------------------------------
# LVGL — single page with the ClaudeOrb Lottie at 400x400 centered
# ----------------------------------------------------------------------------
lvgl:
  buffer_size: 100%
  byte_order: little_endian
  ppa_enabled: true
  displays:
    - main_display

  pages:
    - id: orb_page
      bg_color: 0x000000
      widgets:
        - lottie:
            id: orb_anim
            file: claude_orb_thinking.json
            width: 400
            height: 400
            loop: true
            auto_start: true
            align: CENTER

        - label:
            id: fps_label
            text: "Lottie 400x400 @30fps"
            text_color: 0x808080
            align: BOTTOM_MID
            y: -20
