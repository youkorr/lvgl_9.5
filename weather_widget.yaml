# =============================================================================
# Weather Widget pour LVGL 9.5 / ESPHome
# =============================================================================
# Widget météo utilisant UN SEUL fichier Lottie avec les Slots ThorVG
# pour contrôler dynamiquement :
#   - Le texte (ville, température, atmosphère, min/max)
#   - Les icônes météo (pluie, soleil, neige, orage, etc.)
#   - Les couleurs de fond (thèmes/dégradés)
#
# C'est l'équivalent LVGL du démo "Motion Tokens" de LottieFiles.
#
# Fichier Lottie requis sur la carte SD :
#   /sdcard/weather/weather_widget.json
#
# Ce fichier contient les slots suivants (définis dans le JSON) :
#   - city, temperature, atmosphere, lowest-temp, highest-temp (Text)
#   - icon-rain, icon-sunny, icon-cloudy, icon-night, icon-snow,
#     icon-storm, icon-windy, icon-snowstorm (Scalar = opacité 0/100)
#   - gradient-1..5 (Color = couleurs du fond)
#
# API utilisée : tvg_lottie_animation_override() de ThorVG
# =============================================================================


# ---------------------------------------------------------------------------
# Globals
# ---------------------------------------------------------------------------
globals:
  - id: ww_city_name
    type: std::string
    restore_value: no
    initial_value: '"Paris"'

  - id: ww_lat
    type: float
    restore_value: no
    initial_value: '48.8566'

  - id: ww_lon
    type: float
    restore_value: no
    initial_value: '2.3522'

  - id: ww_theme_idx
    type: int
    restore_value: no
    initial_value: '0'


# ---------------------------------------------------------------------------
# Rafraîchissement automatique
# ---------------------------------------------------------------------------
interval:
  - interval: 5min
    then:
      - script.execute: ww_fetch_weather


# ---------------------------------------------------------------------------
# Scripts
# ---------------------------------------------------------------------------
script:
  # === Sélection de ville ===
  - id: ww_on_city_change
    parameters:
      idx: int
    then:
      - lambda: !lambda |-
          struct City { const char* name; float lat; float lon; };
          static const City cities[] = {
            {"Paris",        48.8566,   2.3522},
            {"London",       51.5074,  -0.1278},
            {"Tokyo",        35.6762, 139.6503},
            {"New York",     40.7128, -74.0060},
            {"Sydney",      -33.8688, 151.2093},
            {"Taipei",       25.0330, 121.5654},
            {"Bangkok",      13.7563, 100.5018},
            {"Seoul",        37.5665, 126.9780},
            {"Kuala Lumpur",  3.1390, 101.6869},
            {"Singapore",    1.3521, 103.8198},
          };
          int i = (idx >= 0 && idx < 10) ? idx : 0;
          id(ww_city_name) = cities[i].name;
          id(ww_lat) = cities[i].lat;
          id(ww_lon) = cities[i].lon;
      - script.execute: ww_fetch_weather

  # === Appel API Open-Meteo + override des slots Lottie ===
  - id: ww_fetch_weather
    then:
      - http_request.get:
          url: !lambda |-
            char buf[300];
            snprintf(buf, sizeof(buf),
              "https://api.open-meteo.com/v1/forecast?"
              "latitude=%.4f&longitude=%.4f"
              "&current=temperature_2m,weather_code,is_day"
              "&daily=temperature_2m_min,temperature_2m_max"
              "&timezone=auto&forecast_days=1",
              id(ww_lat), id(ww_lon));
            return std::string(buf);
          on_response:
            then:
              - lambda: !lambda |-
                  if (status_code != 200) {
                    ESP_LOGE("weather", "API error %d", status_code);
                    return;
                  }

                  std::string body = id(http_request).get_string();
                  DynamicJsonDocument doc(2048);
                  if (deserializeJson(doc, body)) {
                    ESP_LOGE("weather", "JSON parse failed");
                    return;
                  }

                  float temp = doc["current"]["temperature_2m"] | 0.0f;
                  int code   = doc["current"]["weather_code"] | 0;
                  bool isDay = doc["current"]["is_day"] | 1;
                  float tmin = doc["daily"]["temperature_2m_min"][0] | 0.0f;
                  float tmax = doc["daily"]["temperature_2m_max"][0] | 0.0f;

                  // --- Déterminer l'icône et l'atmosphère ---
                  const char* icon_id = "icon-cloudy";
                  const char* atmo = "Nuageux";

                  if (!isDay && code <= 1)            { icon_id = "icon-night";     atmo = "Nuit claire"; }
                  else if (code <= 1)                 { icon_id = "icon-sunny";     atmo = "Ensoleillé"; }
                  else if (code <= 3)                 { icon_id = "icon-cloudy";    atmo = "Nuageux"; }
                  else if (code == 45 || code == 48)  { icon_id = "icon-windy";     atmo = "Brouillard"; }
                  else if ((code >= 51 && code <= 67) ||
                           (code >= 80 && code <= 82)){ icon_id = "icon-rain";      atmo = "Pluie"; }
                  else if (code >= 71 && code <= 77)  { icon_id = "icon-snow";      atmo = "Neige"; }
                  else if (code == 85 || code == 86)  { icon_id = "icon-snowstorm"; atmo = "Tempête neige"; }
                  else if (code >= 95)                { icon_id = "icon-storm";     atmo = "Orage"; }

                  // --- Thème couleurs ---
                  static const float themes[][5][3] = {
                    // Thème 0 : Bleu nuit
                    {{0.13f,0.14f,0.18f}, {0.25f,0.59f,0.86f}, {0.58f,0.75f,0.81f}, {0.84f,0.65f,0.30f}, {0.89f,0.31f,0.13f}},
                    // Thème 1 : Noir profond
                    {{0.00f,0.00f,0.00f}, {0.16f,0.19f,0.29f}, {0.20f,0.32f,0.69f}, {0.64f,0.65f,0.64f}, {0.24f,0.21f,1.00f}},
                    // Thème 2 : Vert forêt
                    {{0.09f,0.45f,0.18f}, {0.12f,0.25f,0.19f}, {0.42f,0.60f,0.81f}, {0.64f,0.65f,0.87f}, {0.74f,0.00f,1.00f}},
                    // Thème 3 : Violet/Rose
                    {{0.58f,0.52f,0.85f}, {0.64f,0.65f,0.87f}, {0.72f,0.23f,0.50f}, {1.00f,0.95f,0.72f}, {0.91f,0.35f,0.75f}},
                  };
                  int t = id(ww_theme_idx) % 4;

                  // --- Formater les textes ---
                  char temp_str[16], low_str[16], high_str[16];
                  snprintf(temp_str, sizeof(temp_str), "%.0f°C", temp);
                  snprintf(low_str,  sizeof(low_str),  "L: %.0f°C", tmin);
                  snprintf(high_str, sizeof(high_str), "H: %.0f°C", tmax);

                  // --- Construire le JSON de slot override ---
                  // Toutes les icônes à 0, sauf celle active à 100
                  static const char* all_icons[] = {
                    "icon-rain","icon-snowstorm","icon-windy","icon-night",
                    "icon-sunny","icon-storm","icon-cloudy","icon-snow"
                  };

                  // Construire le JSON pour tvg_lottie_animation_override()
                  char slot_json[2048];
                  int pos = 0;
                  pos += snprintf(slot_json + pos, sizeof(slot_json) - pos, "{");

                  // Couleurs de gradient
                  for (int g = 0; g < 5; g++) {
                    pos += snprintf(slot_json + pos, sizeof(slot_json) - pos,
                      "\"gradient-%d\":{\"p\":{\"a\":0,\"k\":[%.4f,%.4f,%.4f]}},",
                      g + 1, themes[t][g][0], themes[t][g][1], themes[t][g][2]);
                  }

                  // Textes
                  pos += snprintf(slot_json + pos, sizeof(slot_json) - pos,
                    "\"city\":{\"p\":{\"k\":[{\"s\":{\"t\":\"%s\",\"f\":\"SF Pro Regular\",\"s\":50,\"fc\":[0,0,0],\"tr\":0,\"j\":0,\"ca\":0},\"t\":0}]}},"
                    "\"temperature\":{\"p\":{\"k\":[{\"s\":{\"t\":\"%s\",\"f\":\"SF Pro Regular\",\"s\":130,\"fc\":[0,0,0],\"tr\":0,\"j\":0,\"ca\":0},\"t\":0}]}},"
                    "\"atmosphere\":{\"p\":{\"k\":[{\"s\":{\"t\":\"%s\",\"f\":\"SF Pro Regular\",\"s\":40,\"fc\":[0,0,0],\"tr\":0,\"j\":0,\"ca\":0},\"t\":0}]}},"
                    "\"lowest-temp\":{\"p\":{\"k\":[{\"s\":{\"t\":\"%s\",\"f\":\"SF Pro Regular\",\"s\":20,\"fc\":[0,0,0],\"tr\":0,\"j\":0,\"ca\":0},\"t\":0}]}},"
                    "\"highest-temp\":{\"p\":{\"k\":[{\"s\":{\"t\":\"%s\",\"f\":\"SF Pro Regular\",\"s\":20,\"fc\":[0,0,0],\"tr\":0,\"j\":0,\"ca\":0},\"t\":0}]}},",
                    id(ww_city_name).c_str(), temp_str, atmo, low_str, high_str);

                  // Icônes (scalar opacity: 0 = hidden, 100 = visible)
                  for (int ic = 0; ic < 8; ic++) {
                    int val = (strcmp(all_icons[ic], icon_id) == 0) ? 100 : 0;
                    pos += snprintf(slot_json + pos, sizeof(slot_json) - pos,
                      "\"%s\":{\"p\":{\"a\":0,\"k\":%d}}%s",
                      all_icons[ic], val, (ic < 7) ? "," : "");
                  }

                  pos += snprintf(slot_json + pos, sizeof(slot_json) - pos, "}");

                  // --- Appeler tvg_lottie_animation_override() ---
                  lv_lottie_t *lottie = (lv_lottie_t *)id(ww_lottie_widget);
                  if (lottie && lottie->tvg_anim) {
                    Tvg_Result res = tvg_lottie_animation_override(lottie->tvg_anim, slot_json);
                    if (res == TVG_RESULT_SUCCESS) {
                      ESP_LOGI("weather", "Slots updated: %s %.0f°C %s (%s)",
                               id(ww_city_name).c_str(), temp, atmo, icon_id);
                    } else {
                      ESP_LOGE("weather", "Slot override failed: %d", (int)res);
                    }
                  }

                  // Avancer le thème pour le prochain changement de ville
                  id(ww_theme_idx) = (t + 1) % 4;


# =============================================================================
# LVGL Widget - À copier dans votre section lvgl > pages > widgets
# =============================================================================
#
# UN SEUL widget Lottie qui contient TOUT (texte, icônes, fond) :
#
#         - lottie:
#             id: ww_lottie_widget
#             src: "/sdcard/weather/weather_widget.json"
#             x: 30
#             y: 30
#             width: 500
#             height: 500
#             loop: true
#             auto_start: true
#
#         # Dropdown pour changer de ville
#         - dropdown:
#             id: ww_dropdown
#             x: 30
#             y: 540
#             width: 500
#             height: 45
#             options:
#               - "Paris"
#               - "London"
#               - "Tokyo"
#               - "New York"
#               - "Sydney"
#               - "Taipei"
#               - "Bangkok"
#               - "Seoul"
#               - "Kuala Lumpur"
#               - "Singapore"
#             selected_index: 0
#             on_value:
#               then:
#                 - script.execute:
#                     id: ww_on_city_change
#                     idx: !lambda return lv_dropdown_get_selected(id(ww_dropdown));
#
# --------------------------------------------------------------------------
# IMPORTANT : Copier le fichier weather_widget.json sur la carte SD :
#   /sdcard/weather/weather_widget.json
#
# Les polices SF Pro doivent aussi être sur la carte SD si ThorVG
# les cherche (sinon il utilisera un fallback). Voir le README.
# --------------------------------------------------------------------------
#
# Au boot, déclencher le premier chargement :
#   on_boot:
#     priority: -100
#     then:
#       - delay: 10s
#       - script.execute: ww_fetch_weather
