<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600">
  <defs>
    <!-- Background gradient (dark blue/purple like the TikTok ref) -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#2A1F35"/>
      <stop offset="40%" stop-color="#15121F"/>
      <stop offset="100%" stop-color="#08070D"/>
    </radialGradient>

    <!-- Subtle pink/red bloom top -->
    <radialGradient id="topBloom" cx="50%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#C85C7E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C85C7E" stop-opacity="0"/>
    </radialGradient>

    <!-- Orb core gradient -->
    <radialGradient id="orbCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B6FFB0" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#5BFF6B" stop-opacity="0.15"/>
      <stop offset="80%" stop-color="#2AFF5B" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#2AFF5B" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer glow -->
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="40%" stop-color="#2AFF5B" stop-opacity="0"/>
      <stop offset="60%" stop-color="#2AFF5B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2AFF5B" stop-opacity="0"/>
    </radialGradient>

    <!-- Bright hotspot -->
    <radialGradient id="hotspot" cx="60%" cy="65%" r="25%">
      <stop offset="0%" stop-color="#FFFF80" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#B6FF4A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2AFF5B" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow filter -->
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <!-- Claude accent -->
    <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#B8543C"/>
    </linearGradient>
  </defs>

  <!-- ================== BACKGROUND ================== -->
  <rect width="1024" height="600" fill="url(#bgGrad)"/>
  <rect width="1024" height="600" fill="url(#topBloom)"/>

  <!-- ================== TOP BAR ================== -->
  <g opacity="0.9">
    <g transform="translate(24, 20)">
      <circle cx="12" cy="12" r="12" fill="url(#claudeGrad)"/>
      <path d="M 12 4 L 13.5 10.5 L 20 12 L 13.5 13.5 L 12 20 L 10.5 13.5 L 4 12 L 10.5 10.5 Z"
            fill="#fff" opacity="0.95"/>
      <text x="32" y="12" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#F5F5F7">Claude</text>
      <text x="32" y="26" font-family="Inter, Arial, sans-serif" font-size="10" fill="#888892">Sonnet 4.6</text>
    </g>

    <g transform="translate(880, 28)">
      <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="11" fill="#888892">21.3°</text>
      <text x="52" y="0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#F5F5F7">14:32</text>
    </g>
  </g>

  <!-- ================== ORB (center) ================== -->
  <!-- Orb centered at (512, 290), radius ~180 -->
  <g transform="translate(512, 290)">

    <!-- Outer atmospheric glow -->
    <circle cx="0" cy="0" r="240" fill="url(#orbGlow)"/>
    <circle cx="0" cy="0" r="190" fill="url(#orbCore)" filter="url(#bigBloom)"/>

    <!-- Core disc (soft fill) -->
    <circle cx="0" cy="0" r="175" fill="url(#orbCore)"/>

    <!-- Hotspot bloom (bottom-right) -->
    <ellipse cx="40" cy="50" rx="120" ry="90" fill="url(#hotspot)" opacity="0.7"/>

    <!-- ========== Wireframe / filament structure ========== -->
    <g fill="none" stroke="#8BFF90" stroke-width="0.8" opacity="0.85" filter="url(#bloom)">
      <!-- Outer sphere latitude lines (ellipses at different tilts) -->
      <ellipse cx="0" cy="0" rx="175" ry="170" stroke-opacity="0.7"/>
      <ellipse cx="0" cy="0" rx="175" ry="140" stroke-opacity="0.5"/>
      <ellipse cx="0" cy="0" rx="175" ry="100" stroke-opacity="0.4"/>
      <ellipse cx="0" cy="0" rx="175" ry="55" stroke-opacity="0.35"/>
      <ellipse cx="0" cy="0" rx="175" ry="15" stroke-opacity="0.3"/>

      <!-- Longitudes (rotated ellipses to simulate 3D) -->
      <ellipse cx="0" cy="0" rx="30" ry="170" stroke-opacity="0.3"/>
      <ellipse cx="0" cy="0" rx="70" ry="170" stroke-opacity="0.35"/>
      <ellipse cx="0" cy="0" rx="110" ry="170" stroke-opacity="0.4"/>
      <ellipse cx="0" cy="0" rx="150" ry="170" stroke-opacity="0.35"/>
    </g>

    <!-- Bright filaments (key highlights with higher stroke) -->
    <g fill="none" stroke="#D9FFD0" stroke-width="1.4" opacity="0.9" filter="url(#bloom)">
      <path d="M -170 -20 Q -60 -120 80 -150 Q 150 -130 170 -60"/>
      <path d="M -160 40 Q -40 100 120 80 Q 160 60 170 10"/>
      <path d="M -120 -80 Q 0 -50 140 -100"/>
      <path d="M -50 130 Q 60 90 160 100"/>
      <path d="M -170 30 Q -80 60 -20 120"/>
    </g>

    <!-- Yellow/white hot streaks (brightest) -->
    <g fill="none" stroke="#FFFF9A" stroke-width="1.8" opacity="0.95" filter="url(#bloom)">
      <path d="M 30 -10 Q 90 30 130 90"/>
      <path d="M -20 50 Q 40 70 110 100"/>
      <path d="M 20 60 L 150 120"/>
    </g>

    <!-- Tiny particle dots scattered on sphere surface -->
    <g fill="#D9FFD0" opacity="0.8">
      <circle cx="-120" cy="-80" r="1.2"/>
      <circle cx="-40" cy="-140" r="1.4"/>
      <circle cx="60" cy="-150" r="1.2"/>
      <circle cx="130" cy="-80" r="1.3"/>
      <circle cx="160" cy="20" r="1.1"/>
      <circle cx="140" cy="90" r="1.5"/>
      <circle cx="50" cy="160" r="1.2"/>
      <circle cx="-60" cy="150" r="1.3"/>
      <circle cx="-150" cy="60" r="1.4"/>
      <circle cx="-170" cy="-30" r="1.2"/>
      <circle cx="-90" cy="-40" r="1"/>
      <circle cx="20" cy="-80" r="1"/>
      <circle cx="90" cy="-30" r="1.1"/>
      <circle cx="40" cy="30" r="1"/>
      <circle cx="-30" cy="90" r="1.2"/>
      <circle cx="100" cy="40" r="1"/>
      <circle cx="-110" cy="20" r="1.1"/>
      <circle cx="70" cy="-110" r="1.3"/>
    </g>

    <!-- Yellow bright points (plasma arcs) -->
    <g fill="#FFFF80" opacity="0.95">
      <circle cx="80" cy="60" r="2.2" filter="url(#bloom)"/>
      <circle cx="150" cy="-40" r="1.8" filter="url(#bloom)"/>
      <circle cx="-60" cy="-100" r="1.6" filter="url(#bloom)"/>
      <circle cx="130" cy="120" r="2" filter="url(#bloom)"/>
    </g>
  </g>

  <!-- ================== STATUS TEXT UNDER ORB ================== -->
  <g transform="translate(512, 510)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#D9FFD0" text-anchor="middle" opacity="0.95">À l'écoute...</text>
    <text x="0" y="22" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7085" text-anchor="middle">« Baisse les lumières du salon »</text>
  </g>

  <!-- ================== BOTTOM HINT BAR ================== -->
  <g transform="translate(0, 560)" opacity="0.6">
    <line x1="0" y1="0" x2="1024" y2="0" stroke="#2A2A35" stroke-width="1"/>
    <g transform="translate(24, 22)">
      <circle cx="4" cy="0" r="3" fill="#7FD996"/>
      <text x="14" y="4" font-family="Inter, Arial, sans-serif" font-size="10" fill="#888892">Home Assistant connecté</text>
    </g>
    <g transform="translate(820, 22)">
      <text x="0" y="4" font-family="Inter, Arial, sans-serif" font-size="10" fill="#888892">Tap l'orbe pour interrompre</text>
    </g>
  </g>

</svg>
