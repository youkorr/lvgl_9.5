<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600">
  <!-- ================== DEFS ================== -->
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F0F14"/>
      <stop offset="100%" stop-color="#1A1A22"/>
    </linearGradient>

    <!-- Claude accent gradient (Anthropic orange) -->
    <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#B8543C"/>
    </linearGradient>

    <!-- User bubble gradient -->
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B2F3A"/>
      <stop offset="100%" stop-color="#232733"/>
    </linearGradient>

    <!-- Claude bubble gradient -->
    <linearGradient id="assistantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E26"/>
      <stop offset="100%" stop-color="#15151B"/>
    </linearGradient>

    <!-- Glow filter for Claude avatar -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pulsing mic ring -->
    <radialGradient id="micPulse" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#D97757" stop-opacity="0"/>
      <stop offset="85%" stop-color="#D97757" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ================== BACKGROUND ================== -->
  <rect width="1024" height="600" fill="url(#bgGrad)"/>

  <!-- Decorative radial glow top-left -->
  <circle cx="80" cy="60" r="180" fill="#D97757" opacity="0.07"/>
  <circle cx="950" cy="540" r="220" fill="#6B6BEA" opacity="0.05"/>

  <!-- ================== TOP BAR ================== -->
  <rect x="0" y="0" width="1024" height="60" fill="#0A0A10" opacity="0.8"/>
  <line x1="0" y1="60" x2="1024" y2="60" stroke="#2A2A35" stroke-width="1"/>

  <!-- Claude logo/name -->
  <g transform="translate(24, 18)">
    <!-- Claude star logo simplified -->
    <g transform="translate(0, 2)">
      <circle cx="12" cy="12" r="12" fill="url(#claudeGrad)"/>
      <path d="M 12 4 L 13.5 10.5 L 20 12 L 13.5 13.5 L 12 20 L 10.5 13.5 L 4 12 L 10.5 10.5 Z"
            fill="#fff" opacity="0.95"/>
    </g>
    <text x="34" y="17" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#F5F5F7">Claude</text>
    <text x="34" y="32" font-family="Inter, Arial, sans-serif" font-size="10" fill="#888892">Sonnet 4.6  ·  Connecté</text>
  </g>

  <!-- Status indicators top right -->
  <g transform="translate(820, 20)">
    <!-- WiFi -->
    <g fill="#7FD996">
      <path d="M 10 14 Q 15 8 20 14" stroke="#7FD996" stroke-width="1.5" fill="none"/>
      <path d="M 12 16 Q 15 12 18 16" stroke="#7FD996" stroke-width="1.5" fill="none"/>
      <circle cx="15" cy="18" r="1.2"/>
    </g>
    <text x="30" y="20" font-family="Inter, Arial, sans-serif" font-size="11" fill="#888892">HA</text>

    <!-- Temperature -->
    <text x="60" y="20" font-family="Inter, Arial, sans-serif" font-size="11" fill="#888892">21.3°C</text>

    <!-- Time -->
    <text x="135" y="21" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#F5F5F7">14:32</text>

    <!-- Settings icon -->
    <g transform="translate(180, 10)" fill="none" stroke="#888892" stroke-width="1.5">
      <circle cx="10" cy="10" r="3"/>
      <path d="M10 1 L10 4 M10 16 L10 19 M1 10 L4 10 M16 10 L19 10 M3.5 3.5 L5.5 5.5 M14.5 14.5 L16.5 16.5 M3.5 16.5 L5.5 14.5 M14.5 5.5 L16.5 3.5"/>
    </g>
  </g>

  <!-- ================== CHAT AREA ================== -->
  <!-- Messages container -->
  <g transform="translate(0, 70)">

    <!-- === Assistant greeting === -->
    <g transform="translate(24, 10)">
      <circle cx="18" cy="18" r="16" fill="url(#claudeGrad)"/>
      <path d="M 18 8 L 19.5 16 L 27 18 L 19.5 20 L 18 28 L 16.5 20 L 9 18 L 16.5 16 Z" fill="#fff"/>
      <!-- Bubble -->
      <rect x="44" y="0" width="560" height="64" rx="18" ry="18" fill="url(#assistantGrad)" stroke="#2A2A35" stroke-width="1"/>
      <text x="60" y="24" font-family="Inter, Arial, sans-serif" font-size="14" fill="#F5F5F7">Bonjour ! Que puis-je faire pour vous aujourd'hui ?</text>
      <text x="60" y="46" font-family="Inter, Arial, sans-serif" font-size="12" fill="#888892">Vous pouvez me demander de contrôler vos lumières, thermostat,</text>
      <text x="60" y="60" font-family="Inter, Arial, sans-serif" font-size="12" fill="#888892">ou simplement discuter.</text>
    </g>

    <!-- === User message === -->
    <g transform="translate(340, 88)">
      <rect x="0" y="0" width="644" height="42" rx="18" ry="18" fill="url(#userGrad)" stroke="#2A2A35" stroke-width="1"/>
      <text x="20" y="26" font-family="Inter, Arial, sans-serif" font-size="14" fill="#F5F5F7">Baisse les lumières du salon à 30% et mets une musique douce</text>
      <!-- User avatar -->
      <g transform="translate(656, 3)">
        <circle cx="18" cy="18" r="16" fill="#3A3E4A"/>
        <circle cx="18" cy="14" r="5" fill="#888892"/>
        <path d="M 6 30 Q 18 20 30 30 L 30 34 L 6 34 Z" fill="#888892"/>
      </g>
    </g>

    <!-- === Assistant response with tool use === -->
    <g transform="translate(24, 146)">
      <circle cx="18" cy="18" r="16" fill="url(#claudeGrad)"/>
      <path d="M 18 8 L 19.5 16 L 27 18 L 19.5 20 L 18 28 L 16.5 20 L 9 18 L 16.5 16 Z" fill="#fff"/>

      <!-- Main response bubble -->
      <rect x="44" y="0" width="720" height="120" rx="18" ry="18" fill="url(#assistantGrad)" stroke="#2A2A35" stroke-width="1"/>
      <text x="60" y="24" font-family="Inter, Arial, sans-serif" font-size="14" fill="#F5F5F7">C'est fait. J'ai tamisé les lumières du salon à 30% et lancé</text>
      <text x="60" y="42" font-family="Inter, Arial, sans-serif" font-size="14" fill="#F5F5F7">votre playlist « Chill Evening » sur le Sonos.</text>

      <!-- Tool use indicators -->
      <g transform="translate(60, 56)">
        <!-- Light tool chip -->
        <rect x="0" y="0" width="160" height="26" rx="13" ry="13" fill="#D97757" fill-opacity="0.15" stroke="#D97757" stroke-opacity="0.4" stroke-width="1"/>
        <circle cx="14" cy="13" r="5" fill="#D97757"/>
        <path d="M 12 10 L 14 16 L 16 10" stroke="#fff" stroke-width="1.2" fill="none"/>
        <text x="26" y="17" font-family="Inter, Arial, sans-serif" font-size="11" fill="#F5C9B7">light.salon → 30%</text>

        <!-- Media tool chip -->
        <rect x="172" y="0" width="180" height="26" rx="13" ry="13" fill="#6B6BEA" fill-opacity="0.15" stroke="#6B6BEA" stroke-opacity="0.4" stroke-width="1"/>
        <circle cx="186" cy="13" r="5" fill="#6B6BEA"/>
        <path d="M 184 10 L 184 16 L 188 13 Z" fill="#fff"/>
        <text x="198" y="17" font-family="Inter, Arial, sans-serif" font-size="11" fill="#C7C7F5">media_player.sonos</text>
      </g>

      <text x="60" y="104" font-family="Inter, Arial, sans-serif" font-size="11" fill="#666670" font-style="italic">il y a 2 secondes  ·  126 tokens</text>
    </g>
  </g>

  <!-- ================== BOTTOM STATUS BAR / VOICE AREA ================== -->
  <g transform="translate(0, 470)">
    <rect x="0" y="0" width="1024" height="130" fill="#0A0A10" opacity="0.8"/>
    <line x1="0" y1="0" x2="1024" y2="0" stroke="#2A2A35" stroke-width="1"/>

    <!-- Microphone button (active/listening state) -->
    <g transform="translate(462, 20)">
      <!-- Pulse rings -->
      <circle cx="50" cy="50" r="65" fill="url(#micPulse)"/>
      <circle cx="50" cy="50" r="55" fill="none" stroke="#D97757" stroke-opacity="0.3" stroke-width="1"/>

      <!-- Mic circle -->
      <circle cx="50" cy="50" r="42" fill="url(#claudeGrad)" filter="url(#glow)"/>

      <!-- Mic icon -->
      <g transform="translate(38, 30)" fill="#fff">
        <rect x="8" y="0" width="8" height="20" rx="4" ry="4"/>
        <path d="M 2 16 Q 2 26 12 26 Q 22 26 22 16" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <line x1="12" y1="26" x2="12" y2="32" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="7" y1="32" x2="17" y2="32" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Voice waveform visualization (listening) -->
    <g transform="translate(140, 60)" fill="#D97757">
      <rect x="0" y="-4" width="3" height="8" rx="1.5"/>
      <rect x="8" y="-10" width="3" height="20" rx="1.5"/>
      <rect x="16" y="-16" width="3" height="32" rx="1.5"/>
      <rect x="24" y="-22" width="3" height="44" rx="1.5"/>
      <rect x="32" y="-14" width="3" height="28" rx="1.5"/>
      <rect x="40" y="-20" width="3" height="40" rx="1.5"/>
      <rect x="48" y="-26" width="3" height="52" rx="1.5"/>
      <rect x="56" y="-18" width="3" height="36" rx="1.5"/>
      <rect x="64" y="-24" width="3" height="48" rx="1.5"/>
      <rect x="72" y="-12" width="3" height="24" rx="1.5"/>
      <rect x="80" y="-18" width="3" height="36" rx="1.5"/>
      <rect x="88" y="-8" width="3" height="16" rx="1.5"/>
      <rect x="96" y="-14" width="3" height="28" rx="1.5"/>
      <rect x="104" y="-6" width="3" height="12" rx="1.5"/>
      <rect x="112" y="-10" width="3" height="20" rx="1.5"/>
      <rect x="120" y="-4" width="3" height="8" rx="1.5"/>
    </g>

    <!-- Right waveform mirror -->
    <g transform="translate(740, 60)" fill="#D97757">
      <rect x="0" y="-4" width="3" height="8" rx="1.5"/>
      <rect x="8" y="-10" width="3" height="20" rx="1.5"/>
      <rect x="16" y="-14" width="3" height="28" rx="1.5"/>
      <rect x="24" y="-20" width="3" height="40" rx="1.5"/>
      <rect x="32" y="-8" width="3" height="16" rx="1.5"/>
      <rect x="40" y="-18" width="3" height="36" rx="1.5"/>
      <rect x="48" y="-24" width="3" height="48" rx="1.5"/>
      <rect x="56" y="-14" width="3" height="28" rx="1.5"/>
      <rect x="64" y="-22" width="3" height="44" rx="1.5"/>
      <rect x="72" y="-10" width="3" height="20" rx="1.5"/>
      <rect x="80" y="-16" width="3" height="32" rx="1.5"/>
      <rect x="88" y="-6" width="3" height="12" rx="1.5"/>
      <rect x="96" y="-12" width="3" height="24" rx="1.5"/>
      <rect x="104" y="-4" width="3" height="8" rx="1.5"/>
    </g>

    <!-- Status label -->
    <text x="512" y="110" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#D97757" text-anchor="middle">● À l'écoute...</text>
  </g>

  <!-- ================== SIDE TOOL BUTTONS (left edge) ================== -->
  <g transform="translate(8, 90)">
    <!-- New chat -->
    <rect x="0" y="0" width="8" height="56" rx="4" ry="4" fill="#D97757" opacity="0.9"/>
  </g>

</svg>
