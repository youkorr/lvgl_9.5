esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 850
    then:
      - logger.log: "Démarrage - Attente du montage SD..."
      - delay: 4s
      - logger.log: "Allumage rétroéclairage"
      - light.turn_on: backlight

esp32:
  variant: esp32p4
  flash_size: 32MB
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  #engineering_sample: true
  framework:
    type: esp-idf
    #version: 5.5.2
    #platform_version: 55.03.35
    advanced:
      enable_idf_experimental_features: true
      disable_vfs_support_dir: false
      #disable_fatfs: False
      include_builtin_idf_components:
        - fatfs
        - wear_levelling

    sdkconfig_options:
    # ===== STACKS & TIMEOUTS =====
      CONFIG_PTHREAD_TASK_STACK_SIZE_DEFAULT: "32768"
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      CONFIG_ESP_TIMER_TASK_STACK_SIZE: "4096"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"
      CONFIG_ESP_TASK_LOOP_STACK_SIZE: "16384"
  
      # ===== PSRAM (ESP32-P4 200 MHz, code execute depuis PSRAM) =====
      CONFIG_ESP32_SPIRAM_SUPPORT: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_XIP_FROM_PSRAM: "y"
      CONFIG_SPIRAM_SPEED_200M: "y"
      CONFIG_SPIRAM_SPEED: "200"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "0"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
  
      # ===== CACHE L2 (ESP32-P4) =====
      CONFIG_CACHE_L2_CACHE_256KB: "y"
      CONFIG_CACHE_L2_CACHE_LINE_128B: "y"
  
      # ===== LVGL : 2 threads de rendu (bi-coeur) =====
      CONFIG_LV_DRAW_SW_DRAW_UNIT_CNT: "2"
  
      # ===== FATFS =====
      CONFIG_FATFS_LFN_HEAP: "y"
      CONFIG_FATFS_LFN_STACK: "y"
  
      # ===== VFS =====
      CONFIG_VFS_SUPPORT_IO: "y"
      CONFIG_VFS_MAX_COUNT: "16"
  
      # ===== LWIP / Sockets =====
      CONFIG_LWIP_SOCKET: "y"
      CONFIG_LWIP_MAX_SOCKETS: "16"
  
      # ===== H264 / Audio =====
      CONFIG_ESP_H264_DUAL_TASK: "y"
      CONFIG_USE_AUDIO_AAC_SUPPORT: "y"

http_request:    

psram:
  mode: hex
  speed: 200MHz

