# ============================================================================
# Scripts
# ============================================================================
script:
  - id: update_clock
    then:
      - lvgl.label.update:
          id: lbl_clock
          text: !lambda |-
            char buf[16];
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("--:--");
            int h = t.hour % 12;
            if (h == 0) h = 12;
            snprintf(buf, sizeof(buf), "%d:%02d", h, t.minute);
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_clock_period
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("");
            return std::string(t.hour < 12 ? "AM" : "PM");

  - id: refresh_chambre_header
    then:
      - lvgl.label.update:
          id: lbl_temp_chambre
          text: !lambda |-
            char buf[32];
            float t = id(ha_temp_chambre).has_state() ? id(ha_temp_chambre).state : 0.0f;
            float h = id(ha_humid_chambre).has_state() ? id(ha_humid_chambre).state : 0.0f;
            snprintf(buf, sizeof(buf), "%.1f °C (%.0f %%)", t, h);
            return std::string(buf);

  - id: refresh_salon_header
    then:
      - lvgl.label.update:
          id: lbl_temp_salon
          text: !lambda |-
            char buf[32];
            float t = id(ha_temp_salon).has_state() ? id(ha_temp_salon).state : 0.0f;
            float h = id(ha_humid_salon).has_state() ? id(ha_humid_salon).state : 0.0f;
            snprintf(buf, sizeof(buf), "%.1f °C (%.0f %%)", t, h);
            return std::string(buf);

# ============================================================================
# LVGL UI
# ============================================================================
lvgl:
  use_ppa: true
  byte_order: little_endian
  displays:
    - main_display
  touchscreens:
    - touch

  style_definitions:
    - id: card_style
      bg_color: c_card
      bg_opa: COVER
      border_width: 0
      radius: 16
      pad_all: 12
    - id: card_alt_style
      bg_color: c_card_alt
      bg_opa: COVER
      border_width: 0
      radius: 14
      pad_all: 10
    - id: card_accent_style
      bg_color: c_card_accent
      bg_opa: COVER
      border_width: 0
      radius: 14
      pad_all: 10
    - id: btn_style
      bg_color: c_card_alt
      bg_opa: COVER
      border_width: 0
      radius: 12
      text_color: c_text

  pages:
    - id: home_page
      bg_color: c_bg
      widgets:

        # ====================================================================
        # COLONNE GAUCHE — CHAMBRE
        # ====================================================================
        # Carte Consommation
        - obj:
            x: 10
            y: 10
            width: 310
            height: 130
            styles: card_style
            widgets:
              - label:
                  x: 0
                  y: 0
                  text: "\U000F0E14"   # icône éclair
                  text_font: font_mdi
                  text_color: c_blue
              - label:
                  x: 30
                  y: 2
                  text: "Consommation en temps réel"
                  text_color: c_muted
                  text_font: font_xs
              - label:
                  id: lbl_power_value
                  align: TOP_RIGHT
                  x: 0
                  y: 0
                  text: "470 VA"
                  text_color: c_text
                  text_font: font_sm
              # Mini sparkline
              - line:
                  id: power_sparkline
                  x: 0
                  y: 30
                  width: 290
                  height: 90
                  line_color: c_accent
                  line_width: 2
                  line_rounded: true
                  points: [[0,70],[15,60],[30,50],[45,55],[60,40],[75,30],[90,45],[105,55],[120,35],[135,50],[150,45],[165,30],[180,20],[195,30],[210,45],[225,55],[240,40],[255,60],[270,70],[285,55]]

        # En-tête Chambre + température
        - obj:
            x: 10
            y: 150
            width: 310
            height: 28
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            widgets:
              - label:
                  x: 0
                  y: 4
                  text: "\U000F02E3  Chambre"
                  text_color: c_text
                  text_font: font_md
              - label:
                  id: lbl_temp_chambre
                  align: TOP_RIGHT
                  x: 0
                  y: 6
                  text: "19.2 °C (41 %)"
                  text_color: c_muted
                  text_font: font_xs

        # Carte de contrôle Chambre (toute la chambre)
        - button:
            x: 10
            y: 184
            width: 150
            height: 70
            styles: card_style
            id: card_chambre_all
            on_click:
              - homeassistant.service:
