# ============================================================================
# Dashboard ESP32-P4 Waveshare 7" Touch LCD (1024x600)
# - 3 colonnes: Chambre / Animation centrale / Salon
# - Animation MP4 au centre, agrandissable en plein écran sur touch
# - Entités Home Assistant pour ajouter facilement des devices
# ----------------------------------------------------------------------------
# Composants requis (cf. external_components):
#   - lvgl 9.5 (youkorr/lvgl_9.5)
#   - mp4_player (youkorr/test2_esp_video_esphome) avec fullscreen_on_touch
#   - sd_mmc_card, storage, webdavbox3
#
# Carte SD attendue:
#   - /sdcard/videos/animation.mp4   (vidéo centrale MJPEG, ~340x270 ou plus,
#                                     recommandée: 640x480 MJPEG @ 20fps)
# ============================================================================

substitutions:
  device_name: "p4-dashboard"
  friendly_name: "P4 Dashboard"
  # Vidéo centrale animée (vous pouvez aussi la pointer sur /usb/...)
  central_video: "/sdcard/videos/animation.mp4"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 850
    then:
      - logger.log: "Démarrage - Attente du montage SD..."
      - delay: 4s
      - logger.log: "Allumage rétroéclairage"
      - light.turn_on: backlight

esp32:
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    version: 5.5.2
    platform_version: 55.03.35
    advanced:
      enable_idf_experimental_features: yes
      disable_vfs_support_dir: false
    sdkconfig_options:
      CONFIG_ESP_H264_DUAL_TASK: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_ESP32_SPIRAM_SUPPORT: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_FATFS_LFN_STACK: "y"
      CONFIG_LWIP_MAX_SOCKETS: "16"
      CONFIG_VFS_SUPPORT_IO: "y"
      CONFIG_VFS_MAX_COUNT: "16"
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      CONFIG_ESP_TIMER_TASK_STACK_SIZE: "4096"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"
      CONFIG_ESP_TASK_LOOP_STACK_SIZE: "16384"
      CONFIG_FATFS_LFN_HEAP: "y"
      CONFIG_SPIRAM_SPEED_200M: "y"
      CONFIG_SPIRAM_SPEED: "200"

psram:
  speed: 200MHz

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO
  logs:
    lvgl: WARN
    display: WARN
    mp4_player: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

network:
  enable_ipv6: true

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: update_clock
    on_time:
      - seconds: "0"
        minutes: "*"
        then:
          - script.execute: update_clock
  - platform: sntp
    id: sntp_time

i2c:
  - id: bsp_bus
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz
    scan: true

# Alimentation MIPI-DSI sur ESP32-P4 Waveshare
esp_ldo:
  - voltage: 2.5V
    channel: 3
  - voltage: 2.5V
    channel: 4

# ============================================================================
# Composants externes
# ============================================================================
external_components:
  - source:
      type: git
      url: https://github.com/youkorr/lvgl_9.5
      ref: claude/esp32-dashboard-video-7L9Gc
    components: [lvgl, image, font]
    refresh: always
  - source:
      type: git
      url: https://github.com/youkorr/test2_esp_video_esphome
      ref: claude/esp32-dashboard-video-7L9Gc
    components: [sd_mmc_card, storage, webdavbox3, mp4_player]
    refresh: always

# ============================================================================
# Stockage SD
# ============================================================================
sd_mmc_card:
  id: sd_card
  clk_pin: GPIO43
  cmd_pin: GPIO44
  data0_pin: GPIO39
  data1_pin: GPIO40
  data2_pin: GPIO41
  data3_pin: GPIO42
  mode_1bit: false
  slot: 0

webdavbox3:
  id: sd_webdav
  root_path: "/sdcard"
  url_prefix: "/"
  port: 81
  username: !secret webdav_user
  password: !secret webdav_password

storage:
  platform: sd_direct
  id: my_storage
  sd_component: sd_card
  root_path: "/sdcard"

# ============================================================================
# Lecteur MP4 (animation centrale)
# ============================================================================
mp4_player:
  - id: central_video_player
    file_path: ${central_video}
    parent_id: anim_card        # carré LVGL au centre du dashboard
    auto_play: true
    loop: true
    show_controls: false        # contrôles affichés seulement en plein écran
    fullscreen_on_touch: true   # ← un touch agrandit l'animation
    fullscreen_anim_ms: 400
    on_play:
      then:
        - logger.log: "Animation lancée"
    on_stop:
      then:
        - logger.log: "Animation stoppée"

# ============================================================================
# Affichage MIPI-DSI
# ============================================================================
display:
  - platform: mipi_dsi
    id: main_display
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B
    reset_pin:
      number: 33
    rotation: 0
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 1024
      height: 600

touchscreen:
  - platform: gt911
    id: touch
    i2c_id: bsp_bus
    reset_pin: GPIO23
    update_interval: 50ms
    on_touch:
      - light.turn_on: backlight
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false

output:
  - platform: ledc
    pin: GPIO32
    id: backlight_pwm
    frequency: 1000Hz
    inverted: true

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 250ms

# ============================================================================
# Couleurs
# ============================================================================
color:
  - id: c_bg
    hex: "0c0c0e"
  - id: c_card
    hex: "1a1a1d"
  - id: c_card_alt
    hex: "242428"
  - id: c_card_accent
    hex: "2f2738"      # violet sombre (pour cartes "Open ...")
  - id: c_text
    hex: "f0f0f3"
  - id: c_muted
    hex: "8d8d96"
  - id: c_accent
    hex: "b58aff"
  - id: c_orange
    hex: "f0a36b"
  - id: c_blue
    hex: "7ac3ff"

# ============================================================================
# Entités Home Assistant (devices)
# Tous les sensors HA ci-dessous sont des points d'entrée: pour ajouter un
# nouveau device, ajoutez simplement une ligne ici, puis référencez son id
# depuis un widget LVGL.
# ============================================================================
sensor:
  - platform: homeassistant
    id: ha_power_realtime
    entity_id: sensor.power_consumption
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_power_value
            text: !lambda |-
              char buf[24];
              snprintf(buf, sizeof(buf), "%.0f VA", x);
              return std::string(buf);
  - platform: homeassistant
    id: ha_temp_chambre
    entity_id: sensor.chambre_temperature
    on_value:
      then:
        - script.execute: refresh_chambre_header
  - platform: homeassistant
    id: ha_humid_chambre
    entity_id: sensor.chambre_humidity
    on_value:
      then:
        - script.execute: refresh_chambre_header
  - platform: homeassistant
    id: ha_setpoint_chambre
    entity_id: climate.chambre
    attribute: temperature
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_setpoint_chambre
            text: !lambda |-
              char buf[8];
              snprintf(buf, sizeof(buf), "%.0f", x);
              return std::string(buf);
  - platform: homeassistant
    id: ha_temp_salon
    entity_id: sensor.salon_temperature
    on_value:
      then:
        - script.execute: refresh_salon_header
  - platform: homeassistant
    id: ha_humid_salon
    entity_id: sensor.salon_humidity
    on_value:
      then:
        - script.execute: refresh_salon_header
  - platform: homeassistant
    id: ha_setpoint_salon
    entity_id: climate.salon
    attribute: temperature
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_setpoint_salon
            text: !lambda |-
              char buf[8];
              snprintf(buf, sizeof(buf), "%.1f", x);
              return std::string(buf);
  - platform: homeassistant
    id: ha_outdoor_temp
    entity_id: weather.home
    attribute: temperature
  # Templates exposés à HA (utilisé pour les % de fenêtre / volet)
  - platform: template
    id: chambre_window_pct
    name: "Chambre Window Open %"
    lambda: "return 56;"
    update_interval: 60s
  - platform: template
    id: salon_window_pct
    name: "Salon Window Open %"
    lambda: "return 100;"
    update_interval: 60s

text_sensor:
  - platform: homeassistant
    id: ha_weather_state
    entity_id: weather.home
  - platform: homeassistant
    id: ha_chambre_window_lastseen
    entity_id: binary_sensor.chambre_window
    attribute: last_changed
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_chambre_lastseen
            text: !lambda 'return x;'
  - platform: homeassistant
    id: ha_bain_window_lastseen
    entity_id: binary_sensor.salle_de_bain_window
    attribute: last_changed
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_bain_lastseen
            text: !lambda 'return x;'
  - platform: homeassistant
    id: ha_raspberry_state
    entity_id: switch.raspberry_tv
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_raspberry_state
            text: !lambda 'return x == "on" ? std::string("Allumé") : std::string("Éteint");'
  - platform: homeassistant
    id: ha_imprimante3d_state
    entity_id: switch.imprimante_3d
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_imprimante_state
            text: !lambda 'return x == "on" ? std::string("Allumé") : std::string("Éteint");'

binary_sensor:
  - platform: homeassistant
    id: ha_chambre_main_light
    entity_id: light.chambre
  - platform: homeassistant
    id: ha_chambre_fan
    entity_id: fan.chambre
  - platform: homeassistant
    id: ha_chambre_humidifier
    entity_id: switch.chambre_humidifier
  - platform: homeassistant
    id: ha_chambre_dressing
    entity_id: light.dressing
  - platform: homeassistant
    id: ha_chambre_cover
    entity_id: cover.chambre
  - platform: homeassistant
    id: ha_salon_main_light
    entity_id: light.salon
  - platform: homeassistant
    id: ha_salon_fan
    entity_id: fan.salon
  - platform: homeassistant
    id: ha_salon_tv
    entity_id: media_player.tv_salon
  - platform: homeassistant
    id: ha_salon_pc
    entity_id: switch.pc_salon
  - platform: homeassistant
    id: ha_salon_cover
    entity_id: cover.salon

