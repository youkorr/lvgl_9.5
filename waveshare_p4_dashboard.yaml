  - voltage: 2.5V
    channel: 3
  - voltage: 2.5V
    channel: 4

# ============================================================================
# ESP32-C6 co-processeur (WiFi/BT par SDIO)
# ============================================================================
esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true
  slot: 1

# ============================================================================
# Audio (I2S + DAC ES8311 + ADC ES7210 + micro + speaker + mixer)
# ============================================================================
i2s_audio:
  - id: audio_bus
    i2s_mclk_pin: GPIO13
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bsp_bus
    address: 0x18

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bsp_bus
    address: 0x40

microphone:
  - platform: i2s_audio
    id: esp32_microphone
    i2s_audio_id: audio_bus
    i2s_din_pin: GPIO11
    sample_rate: 16000
    bits_per_sample: 16bit
    adc_type: external

speaker:
  - platform: i2s_audio
    id: esp32_speaker
    i2s_audio_id: audio_bus
    i2s_dout_pin: GPIO9
    audio_dac: es8311_dac
    dac_type: external
    channel: mono
    buffer_duration: 500ms
    bits_per_sample: 16bit
    sample_rate: 48000

  - platform: mixer
    id: mixing_speaker
    output_speaker: esp32_speaker
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

media_player:
  - platform: speaker
    name: "ESP32 P4 Media Player"
    id: speaker_media_player
    codec_support_enabled: true
    volume_min: 0.5
    volume_max: 0.75
    volume_increment: 0.05
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      num_channels: 1
      sample_rate: 48000
    on_announcement:
      - if:
          condition: { microphone.is_capturing: }
          then:
            - micro_wake_word.stop
            - voice_assistant.stop
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
      - switch.turn_on: audio_amplifier
      - delay: 100ms
    on_play:
      - switch.turn_on: audio_amplifier
      - delay: 100ms
      - micro_wake_word.stop
      - voice_assistant.stop
    on_idle:
      - delay: 100ms
      - switch.turn_off: audio_amplifier
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - micro_wake_word.start

# ============================================================================
# Wake word + assistant vocal
# ============================================================================
micro_wake_word:
  id: my_wake_word
  models:
    - model: okay_nabu
  on_wake_word_detected:
    - lvgl.page.show: orb_page
    - component.update: main_display
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  microphone: esp32_microphone
  media_player: speaker_media_player
  micro_wake_word: my_wake_word
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  conversation_timeout: 300s
  on_start:     [lvgl.page.show: orb_page]
  on_listening: [lvgl.page.show: orb_page]
  on_stt_end:   [lvgl.page.show: orb_page]
  on_tts_start: [lvgl.page.show: orb_page]
  on_tts_end:   [lvgl.page.show: orb_page]
  on_end:
    - wait_until:
        condition: media_player.is_announcing
        timeout: 0.5s
    - wait_until:
        - and:
          - not: media_player.is_announcing
          - not: media_player.is_playing
    - lvgl.page.show: orb_page
    - micro_wake_word.start
  on_error: [lvgl.page.show: orb_page]
  on_client_connected:    [micro_wake_word.start]
  on_client_disconnected: [micro_wake_word.stop]

# ============================================================================
# ESP-Video + caméra OV5647 (face detection + reconnaissance)
# ============================================================================
esp_video:
  i2c_id: bsp_bus
  xclk_pin: GPIO36
  xclk_freq: 24000000
  enable_jpeg: true
  enable_isp: true
  use_heap_allocator: false

esp_cam_sensor:
  id: tab5_cam
  i2c_id: bsp_bus
  sensor_type: ov5647
  resolution: "800x640"
  pixel_format: "RGB565"
  framerate: 30
  jpeg_quality: 15
  mirror_x: false
  mirror_y: false
  rotation: 0
  crop_offset_x: 0

lvgl_camera_display:
  id: camera_display
  camera_id: tab5_cam
  canvas_id: camera_canvas
  update_interval: 33ms
  face_detection_id: face_detect

face_detection:
  id: face_detect
  camera_id: tab5_cam
  canvas_id: camera_canvas
  model_type: face_recognition
  score_threshold: 0.3
  nms_threshold: 0.5
  detection_interval: 5
  draw_enabled: true
  recognition_enabled: true
  face_db_path: "/sdcard/reconnaisance_faciale/faces.db"
  recognition_threshold: 0.85

network_camera:
  - id: security_cam_1
    url: "http://192.168.1.38:1984/api/stream.mjpeg?src=frigate1_esp32"
    protocol: mjpeg
    width: 640
    height: 480
    canvas_id: security_canvas
    update_interval: 30ms

