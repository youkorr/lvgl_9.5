        # ====================================================================
        # OVERLAY plein écran pour le file browser (caché par défaut)
        # Le mp4_player.media_browser_player y créera son UI sur demande.
        # ====================================================================
        - obj:
            id: media_browser_overlay
            x: 0
            y: 0
            width: 1024
            height: 600
            bg_color: 0x000000
            bg_opa: COVER
            border_width: 0
            radius: 0
            pad_all: 0
            hidden: true

    # ======================================================================
    # PAGE VEILLE — affichée après auto_off secondes d'inactivité
    # ======================================================================
    - id: page_sleep
      bg_color: 0x000000
      on_load:
        - lambda: |-
            ESP_LOGI("lock", "Page veille chargée");
            id(display_lock) = true;
            id(sleep_display_start) = millis();
            auto canvas = id(face_unlock_canvas);
            if (canvas != nullptr) {
              id(camera_display).configure_canvas(canvas);
            }
        - switch.turn_off: camera_1_switch
        - light.turn_on: backlight
      widgets:
        - obj:
            id: sleep_touch_zone
            x: 0
            y: 0
            width: 1024
            height: 600
            bg_color: 0x000000
            bg_opa: COVER
            border_opa: TRANSP
            on_click:
              - lambda: |-
                  ESP_LOGI("lock", "Touch détecté -> face_unlock");
              - light.turn_on: backlight
              - lvgl.page.show: face_unlock_page
              - switch.turn_on: lvgl_display_enable_switch
            widgets:
              - label:
                  id: sleep_time_label
                  align: CENTER
                  y: -40
                  text: "--:--"
                  text_color: 0x333333
                  text_font: roboto_48
              - label:
                  align: CENTER
                  y: 40
                  text: "Touchez l'écran pour déverrouiller"
                  text_color: 0x222222
                  text_font: roboto_24

    # ======================================================================
    # PAGE FACE_UNLOCK — reconnaissance faciale + PIN
    # ======================================================================
    - id: face_unlock_page
      bg_color: 0x0d1117
      on_load:
        - lambda: |-
            ESP_LOGI("lock", "Page face_unlock chargée");
            id(display_lock) = true;
            id(face_detect).reset_last_recognition();
            id(tab5_cam).start_streaming();
            auto canvas = id(face_unlock_canvas);
            if (canvas != nullptr) {
              id(camera_display).configure_canvas(canvas);
            }
            id(unlock_timeout_start) = millis();
            id(camera_streaming_active) = true;
      widgets:
        # Canvas caméra (côté gauche)
        - canvas:
            id: face_unlock_canvas
            x: 10
            y: 15
            width: 640
            height: 555
            bg_color: 0x000000
            radius: 8
        # Statut
        - label:
            id: face_status_label
            x: 10
            y: 575
            width: 640
            text_align: CENTER
            text: "Aucun visage détecté"
            text_color: 0x58a6ff
            text_font: roboto_18
        # Champ code PIN
        - obj:
            x: 660
            y: 15
            width: 354
            height: 60
            bg_color: 0x161b22
            radius: 10
            border_width: 0
            widgets:
              - label:
                  id: unlock_code_display
                  align: CENTER
                  text: "_ _ _ _"
                  text_color: 0x8b949e
                  text_font: roboto_24
        # Pavé numérique
        - buttonmatrix:
            id: unlock_keypad
            x: 660
            y: 85
            width: 354
            height: 480
            one_checked: false
            rows:
              - buttons:
                  - text: "1"
                    control: { no_repeat: true }
                  - text: "2"
                    control: { no_repeat: true }
                  - text: "3"
                    control: { no_repeat: true }
              - buttons:
                  - text: "4"
                    control: { no_repeat: true }
                  - text: "5"
                    control: { no_repeat: true }
                  - text: "6"
                    control: { no_repeat: true }
              - buttons:
                  - text: "7"
                    control: { no_repeat: true }
                  - text: "8"
                    control: { no_repeat: true }
                  - text: "9"
                    control: { no_repeat: true }
              - buttons:
                  - text: ""
                    control: { no_repeat: true }
                  - text: "0"
                    control: { no_repeat: true }
                  - text: ""
                    control: { no_repeat: true }
        # Barre de progression timeout
        - bar:
            id: unlock_timeout_bar
            x: 10
            y: 580
            width: 1004
            height: 12
            min_value: 0
            max_value: 100
            value: 100
            bg_color: 0x21262d
            radius: 6
            indicator:
              bg_color: 0x3fb950
              radius: 6

    # ======================================================================
    # PAGE CAMÉRA — vue Frigate + outils face recognition
    # ======================================================================
    - id: camera_page
      bg_color: 0x000000
      on_load:
        - switch.turn_on: camera_1_switch
      widgets:
        # Canvas Frigate (security_cam_1)
        - canvas:
            id: security_canvas
            x: 10
            y: 10
            width: 640
            height: 480
            bg_color: 0x000000
            radius: 8
        # Canvas caméra locale (pour face enroll)
        - canvas:
            id: camera_canvas
            x: 10
            y: 500
            width: 320
            height: 90
            bg_color: 0x111111
            radius: 6
        # Labels statut
        - label:
            id: cam_status_label
            x: 340
            y: 510
            width: 310
            text: "Frigate live"
            text_color: c_text
            text_font: font_md
        # Boutons
        - button:
            x: 670
            y: 10
            width: 160
            height: 60
            bg_color: c_card_alt
            radius: 12
            on_click:
              - lambda: 'id(tab5_cam).start_streaming();'
              - switch.turn_on: lvgl_display_enable_switch
            widgets:
              - label: { align: CENTER, text: "Démarrer cam", text_font: font_md, text_color: c_text }
        - button:
            x: 845
            y: 10
            width: 165
            height: 60
            bg_color: c_card_alt
            radius: 12
            on_click:
              - lambda: 'id(tab5_cam).stop_streaming();'
              - switch.turn_off: lvgl_display_enable_switch
            widgets:
              - label: { align: CENTER, text: "Arrêter cam", text_font: font_md, text_color: c_text }
        - button:
            x: 670
            y: 80
            width: 160
            height: 60
            bg_color: 0x2f5d8a
            radius: 12
            on_click:
              - lvgl.widget.show: enroll_popup
            widgets:
              - label: { align: CENTER, text: "Enrôler visage", text_font: font_md, text_color: 0xFFFFFF }
        - button:
            x: 845
            y: 80
            width: 165
            height: 60
            bg_color: 0x8a2d3a
            radius: 12
            on_click:
              - lambda: |-
                  id(face_detect).clear_all_faces();
                  ESP_LOGI("face", "Tous les visages effacés");
            widgets:
              - label: { align: CENTER, text: "Effacer tous", text_font: font_md, text_color: 0xFFFFFF }
        - label:
            id: lbl_enrolled_count
            x: 670
            y: 160
            width: 340
            text: "Visages enregistrés : 0"
            text_color: c_muted
            text_font: font_sm
        # Snapshot
        - button:
            x: 670
            y: 200
            width: 340
            height: 60
            bg_color: c_card_alt
            radius: 12
            on_click:
              - lambda: 'id(tab5_cam).capture_frame();'
            widgets:
              - label: { align: CENTER, text: "Snapshot", text_font: font_md, text_color: c_text }
        # Retour
        - button:
            x: 670
            y: 520
            width: 340
            height: 60
            bg_color: c_card_accent
            radius: 12
            on_click:
              - switch.turn_off: camera_1_switch
              - lvgl.page.show: home_page
            widgets:
              - label: { align: CENTER, text: "Retour dashboard", text_font: font_md, text_color: 0xFFFFFF }

        # Popup d'enrôlement (caché)
        - obj:
            id: enroll_popup
            x: 200
            y: 100
            width: 624
            height: 400
            bg_color: 0x161b22
            bg_opa: COVER
            radius: 16
            border_width: 2
            border_color: 0x3fb950
            hidden: true
            widgets:
              - label:
                  align: TOP_MID
                  y: 12
                  text: "Saisir le nom du visage à enrôler"
                  text_color: c_text
                  text_font: font_md
              - textarea:
                  id: name_input
                  x: 30
                  y: 50
                  width: 564
                  height: 50
                  one_line: true
                  placeholder_text: "Nom..."
                  text_font: font_md
                  on_ready:
                    - lambda: |-
                        std::string n = lv_textarea_get_text(id(name_input));
                        if (!n.empty()) {
                          id(face_detect).enroll_face_with_name(n);
                          ESP_LOGI("face", "Visage enrôlé : %s", n.c_str());
                        }
                        lv_textarea_set_text(id(name_input), "");
                    - lvgl.widget.hide: enroll_popup
              - keyboard:
                  id: face_keyboard
                  x: 10
                  y: 110
                  width: 604
                  height: 270
                  mode: TEXT_UPPER
                  textarea: name_input
              - button:
                  align: TOP_RIGHT
                  x: -10
                  y: 10
                  width: 40
                  height: 40
                  bg_color: 0x8a2d3a
                  radius: 20
                  on_click:
                    - lvgl.widget.hide: enroll_popup
                  widgets:
                    - label: { align: CENTER, text: "X", text_color: 0xFFFFFF }

    # ======================================================================
    # PAGE PARAMÈTRES (luminosité, durée veille, etc.)
    # ======================================================================
    - id: settings_page
      bg_color: c_bg
      widgets:
        - label:
            x: 30
            y: 20
            text: "Paramètres"
            text_color: c_text
            text_font: font_lg
        # Luminosité
        - obj:
            x: 30
            y: 70
            width: 480
            height: 110
            styles: card_style
            widgets:
              - label: { x: 0, y: 0, text: "Luminosité écran", text_color: c_text, text_font: font_md }
              - slider:
                  id: settings_brightness
                  x: 0
                  y: 50
                  width: 440
                  height: 16
                  min_value: 0
                  max_value: 100
                  value: 50
                  on_value:
                    then:
                      - lambda: |-
                          auto call = id(brightness_slider).make_call();
                          call.set_value((float)x);
                          call.perform();
        # Durée avant veille
        - obj:
            x: 30
            y: 190
            width: 480
            height: 110
            styles: card_style
            widgets:
              - label: { x: 0, y: 0, text: "Délai avant veille (s)", text_color: c_text, text_font: font_md }
              - label:
                  id: lbl_auto_off
                  x: 0
                  y: 30
                  text: "désactivé"
                  text_color: c_muted
                  text_font: font_sm
              - button:
                  x: 0
                  y: 60
                  width: 100
                  height: 40
                  bg_color: c_card_alt
                  radius: 8
                  on_click:
                    - lambda: |-
                        auto call = id(auto_off).make_call();
                        float v = id(auto_off).state - 10;
                        if (v < -1) v = -1;
                        call.set_value(v);
                        call.perform();
                  widgets:
                    - label: { align: CENTER, text: "-", text_color: c_text, text_font: font_md }
              - button:
                  x: 110
                  y: 60
                  width: 100
                  height: 40
                  bg_color: c_card_alt
                  radius: 8
                  on_click:
                    - lambda: |-
                        auto call = id(auto_off).make_call();
                        call.set_value(id(auto_off).state + 10);
                        call.perform();
                  widgets:
                    - label: { align: CENTER, text: "+", text_color: c_text, text_font: font_md }
        # Système
        - obj:
            x: 530
            y: 70
            width: 470
            height: 510
            styles: card_style
            widgets:
              - label: { x: 0, y: 0, text: "Système", text_color: c_text, text_font: font_md }
              - label: { id: sram_label,   x: 0, y: 40,  text: "SRAM : --",  text_color: c_text, text_font: font_sm }
              - label: { id: psram_label,  x: 0, y: 70,  text: "PSRAM : --", text_color: c_text, text_font: font_sm }
              - label: { id: chip_temp_label, x: 0, y: 100, text: "Temp CPU : --", text_color: c_text, text_font: font_sm }
              - label: { id: wifi_label,   x: 0, y: 130, text: "WiFi : --", text_color: c_text, text_font: font_sm }
              - label: { id: faces_label,  x: 0, y: 160, text: "Visages enregistrés : --", text_color: c_text, text_font: font_sm }
        # Retour
        - button:
            x: 30
            y: 530
            width: 480
            height: 50
            bg_color: c_card_accent
            radius: 12
            on_click:
              - lvgl.page.show: home_page
            widgets:
              - label: { align: CENTER, text: "Retour", text_color: 0xFFFFFF, text_font: font_md }

    # ======================================================================
    # PAGE ORB — assistant vocal (wake word / TTS)
    # ======================================================================
    - id: orb_page
      bg_color: 0x000000
      widgets:
        - obj:
            align: CENTER
            width: 280
            height: 280
            radius: 140
            bg_color: 0x6b3fa5
            bg_opa: 80%
            border_width: 4
            border_color: 0xb58aff
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F036C"
                  text_font: font_mdi_lg
                  text_color: 0xFFFFFF
        - label:
            id: orb_state_label
            align: BOTTOM_MID
            y: -120
            text: "Dis « okay nabu »"
            text_color: c_muted
            text_font: font_md
        - button:
            align: TOP_LEFT
            x: 20
            y: 20
            width: 80
            height: 40
            bg_color: c_card_alt
            radius: 12
            on_click:
              - voice_assistant.stop
              - lvgl.page.show: home_page
            widgets:
              - label: { align: CENTER, text: "Retour", text_color: c_text, text_font: font_sm }
