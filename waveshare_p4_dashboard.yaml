# ============================================================================
# Lecteurs MP4
# ----------------------------------------------------------------------------
# 1) central_video_player : joue UNIQUEMENT l'animation centrale, plein écran
#    animé sur touch. Pas de browser (file_path est défini).
# 2) media_browser_player : utilisé pour parcourir SD + USB via le bouton
#    "Médias". Démarre caché (pas de file_path); show_browser l'affiche en
#    plein écran sur le dashboard, et close()/release_resources rendent
#    toute la mémoire (~1.8 MB de PSRAM) à la fermeture.
# ============================================================================
mp4_player:
  - id: central_video_player
    file_path: ${central_video}
    parent_id: anim_card        # carré LVGL au centre du dashboard
    auto_play: true
    loop: true
    show_controls: false        # contrôles affichés seulement en plein écran
    fullscreen_on_touch: true   # ← un touch agrandit l'animation
    fullscreen_anim_ms: 400
    # Pas de media_directories : l'animation n'est jamais remplacée
    media_directories: []
    on_play:
      then:
        - logger.log: "Animation lancée"
    on_stop:
      then:
        - logger.log: "Animation stoppée"

  - id: media_browser_player
    parent_id: media_browser_overlay
    auto_play: false
    loop: false
    show_controls: true
    fullscreen_on_touch: false
    media_directories:
      - "/sdcard"
      - "/usb"
    usb_media_storage_id: usb_storage
    speaker: media_resampling_speaker
    volume: 70
    on_play:
      - micro_wake_word.stop
      - voice_assistant.stop
      - switch.turn_on: audio_amplifier
      - delay: 100ms
    on_stop:
      - delay: 100ms
      - switch.turn_off: audio_amplifier
      - micro_wake_word.start
    on_close:
      then:
        - logger.log: "Browser fermé, libération de la mémoire..."
        - mp4_player.release_resources: media_browser_player
        - lvgl.widget.hide: media_browser_overlay

