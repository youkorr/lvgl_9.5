# ============================================================================
# Switches (amplificateur audio, caméra, LVGL display enable)
# ============================================================================
switch:
  - platform: gpio
    pin: GPIO53
    name: "Audio Amplifier"
    id: audio_amplifier
    restore_mode: ALWAYS_OFF

  - platform: network_camera
    name: "Camera Frigate"
    camera_id: security_cam_1
    id: camera_1_switch

  - platform: template
    name: "LVGL Camera Display"
    id: lvgl_display_enable_switch
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      - lambda: |-
          auto *lvgl_disp = id(camera_display);
          if (lvgl_disp != nullptr) lvgl_disp->set_enabled(true);
    turn_off_action:
      - lambda: |-
          auto *lvgl_disp = id(camera_display);
          if (lvgl_disp != nullptr) lvgl_disp->set_enabled(false);

# ============================================================================
# Number entities (luminosité, temps avant veille, temps avant écran off)
# ============================================================================
number:
  - platform: template
    id: brightness_slider
    name: "Luminosité Écran"
    icon: "mdi:brightness-6"
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 50
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x > 0;'
            then:
              - light.turn_on:
                  id: backlight
                  brightness: !lambda 'return x / 100.0;'
            else:
              - light.turn_off:
                  id: backlight

  - platform: template
    name: "Screen Off"
    id: auto_off
    optimistic: true
    restore_value: true
    min_value: -1
    max_value: 300
    step: 10
    unit_of_measurement: s
    icon: 'mdi:television-off'
    initial_value: -1

  - platform: template
    name: "Sleep Display Duration"
    id: sleep_display_duration
    icon: 'mdi:clock-outline'
    unit_of_measurement: s
    initial_value: 10
    min_value: -1
    max_value: 300
    step: 10
    optimistic: true
    restore_value: true
    on_value:
      then:
        - lambda: |-
            id(face_unlock_timeout_sec) = (int)x;
            ESP_LOGI("lock", "Auto-Lock timeout: %d sec", (int)x);

# ============================================================================
# Intervalle 500 ms : machine d'état veille + face_unlock
# ============================================================================
interval:
  - interval: 500ms
    then:
      - lambda: |-
          // 1) En mode veille : éteindre le rétroéclairage après le délai
          if (lv_scr_act() == id(page_sleep)->obj) {
            int dur = (int)id(sleep_display_duration).state;
            uint32_t elapsed = (millis() - id(sleep_display_start)) / 1000;
            if (dur > 0 && (int)elapsed >= dur) {
              auto call = id(backlight).turn_off();
              call.perform();
              return;
            }
            // Mise à jour de l'heure sur l'écran de veille
            auto t = id(ha_time).now();
            if (t.is_valid()) {
              char buf[8];
              snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute);
              lv_label_set_text(id(sleep_time_label), buf);
            }
          }
          // 2) Sur la page face_unlock : poll de la reconnaissance + timeout
          if (lv_scr_act() == id(face_unlock_page)->obj) {
            uint32_t elapsed_ms = millis() - id(unlock_timeout_start);
            uint32_t timeout_ms = (uint32_t)id(face_unlock_timeout_sec) * 1000;
            int progress = 100 - (int)((elapsed_ms * 100) / timeout_ms);
            if (progress < 0) progress = 0;
            lv_bar_set_value(id(unlock_timeout_bar), progress, LV_ANIM_OFF);

            auto result = id(face_detect).get_last_recognition();
            float sim = result.similarity;
            int count = id(face_detect).get_detected_face_count();
            if (count > 0) {
              char buf[64];
              snprintf(buf, sizeof(buf), "Visage détecté (similarité: %.2f)", sim);
              lv_label_set_text(id(face_status_label), buf);
            } else {
              lv_label_set_text(id(face_status_label), "Aucun visage détecté");
            }
            // Déverrouillage par reconnaissance faciale
            if (sim >= 0.70f && count > 0) {
              id(display_lock) = false;
              char welcome[96];
              snprintf(welcome, sizeof(welcome), "Bienvenue %s !",
                       id(face_detect).get_last_recognized_name().c_str());
              ESP_LOGI("lock", "%s", welcome);
              id(tab5_cam).stop_streaming();
              id(lvgl_display_enable_switch).turn_off();
              lv_scr_load(id(home_page)->obj);
            }
            // Timeout : retour à la page veille
            if (elapsed_ms >= timeout_ms) {
              ESP_LOGI("lock", "Timeout déverrouillage facial");
              id(tab5_cam).stop_streaming();
              lv_scr_load(id(page_sleep)->obj);
              auto call_bl = id(backlight).turn_off();
              call_bl.perform();
            }
          }

  - interval: 30s
    then:
      - lambda: |-
          size_t internal_free = heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
          size_t psram_free = heap_caps_get_free_size(MALLOC_CAP_SPIRAM);
          ESP_LOGI("mem", "Heap libre: SRAM=%uKB PSRAM=%uKB",
                   internal_free / 1024, psram_free / 1024);
          // Met aussi à jour les labels système si la page settings est active
          if (lv_scr_act() == id(settings_page)->obj) {
            char buf[64];
            snprintf(buf, sizeof(buf), "SRAM libre : %u KB", (unsigned)(internal_free / 1024));
            lv_label_set_text(id(sram_label), buf);
            snprintf(buf, sizeof(buf), "PSRAM libre : %u MB", (unsigned)(psram_free / (1024*1024)));
            lv_label_set_text(id(psram_label), buf);
          }

# ============================================================================
# Key collector : PIN sur face_unlock_page
# ============================================================================
key_collector:
  - id: unlock_pin_collector
    source_id: unlock_keypad
    min_length: 4
    max_length: 4
    end_keys: "#"
    end_key_required: false
    back_keys: "*"
    on_progress:
      - lambda: |-
          // Masque l'entrée : affiche * pour chaque chiffre, _ pour les positions vides
          std::string masked;
          for (size_t i = 0; i < 4; i++) {
            if (i < x.length()) masked += "*";
            else                 masked += "_";
            if (i < 3) masked += " ";
          }
          lv_label_set_text(id(unlock_code_display), masked.c_str());
    on_result:
      - if:
          condition:
            lambda: 'return x == "1169";'   # PIN par défaut, à changer
          then:
            - lambda: |-
                id(display_lock) = false;
                ESP_LOGI("lock", "PIN correct — déverrouillage");
                id(tab5_cam).stop_streaming();
            - switch.turn_off: lvgl_display_enable_switch
            - lvgl.page.show: home_page
            - lvgl.label.update:
                id: unlock_code_display
                text: "_ _ _ _"
          else:
            - lvgl.label.update:
                id: unlock_code_display
                text: "ERREUR"
            - delay: 1s
            - lvgl.label.update:
                id: unlock_code_display
                text: "_ _ _ _"

# ============================================================================
