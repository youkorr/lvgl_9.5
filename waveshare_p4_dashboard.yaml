# ============================================================================
# Scripts
# ============================================================================
script:
  - id: update_clock
    then:
      - lvgl.label.update:
          id: lbl_clock
          text: !lambda |-
            char buf[16];
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("--:--");
            int h = t.hour % 12;
            if (h == 0) h = 12;
            snprintf(buf, sizeof(buf), "%d:%02d", h, t.minute);
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_clock_period
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("");
            return std::string(t.hour < 12 ? "AM" : "PM");

  - id: refresh_chambre_header
    then:
      - lvgl.label.update:
          id: lbl_temp_chambre
          text: !lambda |-
            char buf[32];
            float t = id(ha_temp_chambre).has_state() ? id(ha_temp_chambre).state : 0.0f;
            float h = id(ha_humid_chambre).has_state() ? id(ha_humid_chambre).state : 0.0f;
            snprintf(buf, sizeof(buf), "%.1f °C (%.0f %%)", t, h);
            return std::string(buf);

  - id: refresh_salon_header
    then:
      - lvgl.label.update:
          id: lbl_temp_salon
          text: !lambda |-
            char buf[32];
            float t = id(ha_temp_salon).has_state() ? id(ha_temp_salon).state : 0.0f;
            float h = id(ha_humid_salon).has_state() ? id(ha_humid_salon).state : 0.0f;
            snprintf(buf, sizeof(buf), "%.1f °C (%.0f %%)", t, h);
            return std::string(buf);

  # Met à jour l'icône météo en fonction de l'état HA actuel.
  # Utilise la surcharge lv_image_set_src(obj, image::Image*) fournie par
  # lvgl_esphome.h ; SdImageComponent hérite de image::Image et expose
  # le buffer chargé depuis la SD.
  - id: update_weather_icon
    then:
      - if:
          condition:
            lambda: 'return id(ha_weather_state).has_state();'
          then:
            - lambda: |-
                std::string s = id(ha_weather_state).state;
                lv_obj_t *img = id(img_weather_now);
                esphome::image::Image *pick = id(w_default);
                if      (s == "clear-night")     pick = id(w_clear_night);
                else if (s == "cloudy")          pick = id(w_cloudy);
                else if (s == "fog")             pick = id(w_fog);
                else if (s == "hail")            pick = id(w_hail);
                else if (s == "lightning")       pick = id(w_lightning);
                else if (s == "lightning-rainy") pick = id(w_lightning_rainy);
                else if (s == "partlycloudy")    pick = id(w_partlycloudy);
                else if (s == "pouring")         pick = id(w_pouring);
                else if (s == "rainy")           pick = id(w_rainy);
                else if (s == "snowy")           pick = id(w_snowy);
                else if (s == "snowy-rainy")     pick = id(w_snowy_rainy);
                else if (s == "sunny")           pick = id(w_sunny);
                else if (s == "windy")           pick = id(w_windy);
                else if (s == "windy-variant")   pick = id(w_windy_variant);
                else if (s == "exceptional")     pick = id(w_exceptional);
                lv_image_set_src(img, pick);
                ESP_LOGI("weather", "Icône météo: %s", s.c_str());

# ============================================================================
# LVGL UI
# ============================================================================
lvgl:
  use_ppa: true            # PPA = hardware accelerator (rotation, blending)
  fps_benchmark: true      # affiche FPS et temps de rendu
  perf_monitor: true       # overlay perf (CPU LVGL)
  color_depth: 16
  byte_order: little_endian
  displays:
    - main_display
  touchscreens:
    - touch

  # =================================================================
  # Auto-verrouillage : après auto_off secondes d'inactivité, passer
  # à page_sleep et baisser le rétroéclairage. Sortie possible par
  # tap (-> face_unlock_page) ou PIN (key_collector unlock_keypad).
  # =================================================================
  on_idle:
    - timeout: !lambda |-
        int t = (int)id(auto_off).state;
        return (t == -1) ? 86400000 : (t * 1000);
      then:
        - lambda: |-
            // Initialise le canvas caméra la première fois
            static bool canvas_configured = false;
            if (!canvas_configured) {
              auto canvas = id(camera_canvas);
              if (canvas != nullptr) {
                id(camera_display).configure_canvas(canvas);
                canvas_configured = true;
              }
            }
        - if:
            condition:
              and:
                - lambda: 'return id(face_unlock_timeout_sec) > 0;'
                - lambda: 'return !id(display_lock);'
            then:
              - lambda: |-
                  id(display_lock) = true;
                  ESP_LOGI("lock", "Auto-Lock après inactivité");
              - lvgl.page.show: page_sleep
              - light.turn_on: backlight
              - switch.turn_off: lvgl_display_enable_switch

