# ============================================================================
# Entités Home Assistant (devices)
# Tous les sensors HA ci-dessous sont des points d'entrée: pour ajouter un
# nouveau device, ajoutez simplement une ligne ici, puis référencez son id
# depuis un widget LVGL.
# ============================================================================
sensor:
  # Télémétrie système
  - platform: template
    name: "SRAM Free"
    id: sram_free
    lambda: return heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024.0;
    unit_of_measurement: KB
    update_interval: 30s
  - platform: template
    name: "PSRAM Free"
    id: psram_free
    lambda: return heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / (1024.0 * 1024.0);
    unit_of_measurement: MB
    update_interval: 30s
  - platform: internal_temperature
    name: "ESP32-P4 Internal Temperature"
    id: chip_temperature
    update_interval: 30s
    on_value:
      then:
        - if:
            condition:
              lambda: 'return lv_scr_act() == id(settings_page)->obj;'
            then:
              - lvgl.label.update:
                  id: chip_temp_label
                  text: !lambda |-
                    char b[32]; snprintf(b, sizeof(b), "Temp CPU : %.1f °C", x); return std::string(b);
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_sensor
    update_interval: 30s
    on_value:
      then:
        - if:
            condition:
              lambda: 'return lv_scr_act() == id(settings_page)->obj;'
            then:
              - lvgl.label.update:
                  id: wifi_label
                  text: !lambda |-
                    char b[32]; snprintf(b, sizeof(b), "WiFi : %.0f dBm", x); return std::string(b);
  - platform: template
    name: "Enrolled Faces"
    id: enrolled_count
    icon: "mdi:face-man"
    lambda: return id(face_detect).get_enrolled_count();
    update_interval: 60s
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_enrolled_count
            text: !lambda |-
              char b[64]; snprintf(b, sizeof(b), "Visages enregistrés : %.0f", x); return std::string(b);
        - if:
            condition:
              lambda: 'return lv_scr_act() == id(settings_page)->obj;'
            then:
              - lvgl.label.update:
                  id: faces_label
                  text: !lambda |-
                    char b[64]; snprintf(b, sizeof(b), "Visages enregistrés : %.0f", x); return std::string(b);

  # ----- Capteurs Home Assistant -----
  - platform: homeassistant
    id: ha_power_realtime
    entity_id: sensor.power_consumption
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_power_value
            text: !lambda |-
              char buf[24];
              snprintf(buf, sizeof(buf), "%.0f VA", x);
              return std::string(buf);
  - platform: homeassistant
    id: ha_temp_chambre
    entity_id: sensor.chambre_temperature
    on_value:
      then:
        - script.execute: refresh_chambre_header
  - platform: homeassistant
    id: ha_humid_chambre
    entity_id: sensor.chambre_humidity
    on_value:
      then:
        - script.execute: refresh_chambre_header
  - platform: homeassistant
    id: ha_setpoint_chambre
    entity_id: climate.chambre
    attribute: temperature
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_setpoint_chambre
            text: !lambda |-
              char buf[8];
              snprintf(buf, sizeof(buf), "%.0f", x);
              return std::string(buf);
  - platform: homeassistant
    id: ha_temp_salon
    entity_id: sensor.salon_temperature
    on_value:
      then:
        - script.execute: refresh_salon_header
  - platform: homeassistant
    id: ha_humid_salon
    entity_id: sensor.salon_humidity
    on_value:
      then:
        - script.execute: refresh_salon_header
  - platform: homeassistant
    id: ha_setpoint_salon
    entity_id: climate.salon
