    lambda: "return 56;"
    update_interval: 60s
  - platform: template
    id: salon_window_pct
    name: "Salon Window Open %"
    lambda: "return 100;"
    update_interval: 60s

text_sensor:
  - platform: homeassistant
    id: ha_weather_state
    entity_id: weather.home
