# =============================================================================
# Exemple concret : Weather Widget Open-Meteo pour ESP32-P4 / Waveshare
# =============================================================================
#
# Ce fichier montre comment intégrer le weather widget dans une page LVGL.
# Il utilise l'API Open-Meteo (gratuite, sans clé API) pour récupérer
# la météo en temps réel et l'afficher avec des animations Lottie.
#
# Prérequis :
#   1. Copier les fichiers Lottie JSON dans /sdcard/weather/ sur la carte SD
#      (clear-day.json, clear-night.json, cloudy.json, extreme.json,
#       snow.json, thunderstorms-day-rain.json, fog.json, dust-wind.json,
#       overcast.json)
#
#   2. Avoir http_request: dans votre config principale
#
#   3. Ajouter ce bloc dans votre configuration ESPHome existante
#
# Source animations Lottie recommandée :
#   https://github.com/basmilius/weather-icons (format Lottie JSON)
# =============================================================================


# ---------------------------------------------------------------------------
# Variables globales pour l'état météo
# ---------------------------------------------------------------------------
globals:
  - id: ww_city_name
    type: std::string
    restore_value: no
    initial_value: '"Paris"'

  - id: ww_lat
    type: float
    restore_value: no
    initial_value: '48.8566'

  - id: ww_lon
    type: float
    restore_value: no
    initial_value: '2.3522'

  - id: ww_theme_idx
    type: int
    restore_value: no
    initial_value: '0'


# ---------------------------------------------------------------------------
# Rafraîchissement auto toutes les 5 minutes
# ---------------------------------------------------------------------------
interval:
  - interval: 5min
    then:
      - script.execute: ww_fetch_weather


# ---------------------------------------------------------------------------
# Scripts météo
# ---------------------------------------------------------------------------
script:
  # === Sélection de ville ===
  - id: ww_on_city_change
    parameters:
      idx: int
    then:
      - lambda: !lambda |-
          struct City { const char* name; float lat; float lon; };
          static const City cities[] = {
            {"Paris",        48.8566,   2.3522},
            {"London",       51.5074,  -0.1278},
            {"Tokyo",        35.6762, 139.6503},
            {"New York",     40.7128, -74.0060},
            {"Sydney",      -33.8688, 151.2093},
            {"Taipei",       25.0330, 121.5654},
            {"Bangkok",      13.7563, 100.5018},
            {"Seoul",        37.5665, 126.9780},
            {"Kuala Lumpur",  3.1390, 101.6869},
            {"Singapore",    1.3521, 103.8198},
          };
          int i = (idx >= 0 && idx < 10) ? idx : 0;
          id(ww_city_name) = cities[i].name;
          id(ww_lat) = cities[i].lat;
          id(ww_lon) = cities[i].lon;

          lv_label_set_text(id(ww_lbl_city), "Chargement...");
          lv_label_set_text(id(ww_lbl_atmo), "---");
      - script.execute: ww_fetch_weather

  # === Appel API Open-Meteo ===
  - id: ww_fetch_weather
    then:
      - http_request.get:
          url: !lambda |-
            char buf[300];
            snprintf(buf, sizeof(buf),
              "https://api.open-meteo.com/v1/forecast?"
              "latitude=%.4f&longitude=%.4f"
              "&current=temperature_2m,weather_code,is_day"
              "&daily=temperature_2m_min,temperature_2m_max"
              "&timezone=auto&forecast_days=1",
              id(ww_lat), id(ww_lon));
            return std::string(buf);
          on_response:
            then:
              - lambda: !lambda |-
                  if (status_code != 200) {
                    ESP_LOGE("weather", "API error %d", status_code);
                    lv_label_set_text(id(ww_lbl_city), "Erreur réseau");
                    return;
                  }

                  // Récupérer le body JSON
                  std::string body = id(http_request).get_string();

                  // Parse JSON avec ArduinoJson
                  DynamicJsonDocument doc(2048);
                  DeserializationError err = deserializeJson(doc, body);
                  if (err) {
                    ESP_LOGE("weather", "JSON parse error: %s", err.c_str());
                    lv_label_set_text(id(ww_lbl_city), "Erreur données");
                    return;
                  }

                  float temp   = doc["current"]["temperature_2m"] | 0.0f;
                  int   code   = doc["current"]["weather_code"] | 0;
                  bool  is_day = doc["current"]["is_day"] | 1;
                  float tmin   = doc["daily"]["temperature_2m_min"][0] | 0.0f;
                  float tmax   = doc["daily"]["temperature_2m_max"][0] | 0.0f;

                  // --- Mise à jour des labels ---
                  lv_label_set_text(id(ww_lbl_city), id(ww_city_name).c_str());

                  char buf[24];
                  snprintf(buf, sizeof(buf), "%.0f°C", temp);
                  lv_label_set_text(id(ww_lbl_temp), buf);

                  snprintf(buf, sizeof(buf), "L: %.0f°C", tmin);
                  lv_label_set_text(id(ww_lbl_low), buf);

                  snprintf(buf, sizeof(buf), "H: %.0f°C", tmax);
                  lv_label_set_text(id(ww_lbl_high), buf);

                  // --- Description atmosphère ---
                  const char* atmo = "Inconnu";
                  if (!is_day && (code <= 1))            atmo = "Nuit claire";
                  else if (code <= 1)                    atmo = "Ensoleillé";
                  else if (code <= 3)                    atmo = "Nuageux";
                  else if (code == 45 || code == 48)     atmo = "Brouillard";
                  else if ((code >= 51 && code <= 67) ||
                           (code >= 80 && code <= 82))   atmo = "Pluie";
                  else if ((code >= 71 && code <= 77) ||
                           (code >= 85 && code <= 86))   atmo = "Neige";
                  else if (code >= 95)                   atmo = "Orage";
                  lv_label_set_text(id(ww_lbl_atmo), atmo);

                  // --- Sélection animation Lottie ---
                  lv_obj_t* lotties[] = {
                    id(ww_anim_sunny),  id(ww_anim_night),
                    id(ww_anim_cloudy), id(ww_anim_rain),
                    id(ww_anim_snow),   id(ww_anim_storm),
                    id(ww_anim_fog),    id(ww_anim_wind),
                    id(ww_anim_overcast)
                  };
                  for (auto* l : lotties)
                    lv_obj_add_flag(l, LV_OBJ_FLAG_HIDDEN);

                  lv_obj_t* active = nullptr;
                  if (!is_day && code <= 1)              active = id(ww_anim_night);
                  else if (code <= 1)                    active = id(ww_anim_sunny);
                  else if (code <= 3)                    active = id(ww_anim_cloudy);
                  else if (code == 45 || code == 48)     active = id(ww_anim_fog);
                  else if ((code >= 51 && code <= 67) ||
                           (code >= 80 && code <= 82))   active = id(ww_anim_rain);
                  else if ((code >= 71 && code <= 77) ||
                           (code >= 85 && code <= 86))   active = id(ww_anim_snow);
                  else if (code >= 95)                   active = id(ww_anim_storm);
                  else                                   active = id(ww_anim_overcast);

                  if (active) {
                    lv_obj_clear_flag(active, LV_OBJ_FLAG_HIDDEN);
                    auto *ctx = (esphome::lvgl::LottieContext *)lv_obj_get_user_data(active);
                    if (ctx) esphome::lvgl::lottie_restart(ctx);
                  }

                  // --- Cycle de thème couleur ---
                  static const uint32_t themes[][2] = {
                    {0x203A5C, 0x4096DB},   // Bleu nuit
                    {0x010101, 0x293049},   // Noir profond
                    {0x18742D, 0x6A98CF},   // Vert forêt
                    {0x9384DA, 0xB73A80},   // Violet/Rose
                  };
                  int t = id(ww_theme_idx) % 4;
                  lv_obj_set_style_bg_color(id(ww_box),
                    lv_color_hex(themes[t][0]), LV_PART_MAIN);
                  lv_obj_set_style_bg_grad_color(id(ww_box),
                    lv_color_hex(themes[t][1]), LV_PART_MAIN);
                  id(ww_theme_idx) = (t + 1) % 4;

                  ESP_LOGI("weather", "Updated: %s %.0f°C %s (code %d)",
                           id(ww_city_name).c_str(), temp, atmo, code);


