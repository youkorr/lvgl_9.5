name: ESPHome compile (esp32-p4)

# Full `esphome compile` of youkorr/lvgl_9.5 on ESP32-P4, so LVGL build issues
# are caught in CI instead of on hardware. Runtime is not validated.

on:
  push:
    branches: [claude/test-coverage-analysis-2viujv]
    paths:
      - 'components/**'
      - 'tests/esphome/**'
      - '.github/workflows/esphome-compile.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO / IDF
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.espressif
            ~/.cache/pip
          key: lvgl-p4-${{ hashFiles('tests/esphome/tab5_lvgl_test.yaml') }}
          restore-keys: |
            lvgl-p4-

      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install esphome
          esphome version

      - name: Validate config
        run: esphome config tests/esphome/tab5_lvgl_test.yaml

      - name: Compile firmware
        run: esphome compile tests/esphome/tab5_lvgl_test.yaml
