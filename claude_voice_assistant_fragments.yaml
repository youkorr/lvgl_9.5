################################################################################
#  Claude Voice Assistant — YAML fragments for waveshare (3).yaml
################################################################################
#
#  HOW TO USE:
#    Copy each numbered SECTION below into the corresponding top-level key
#    in your `waveshare (3).yaml`. Do NOT duplicate top-level keys — merge
#    the entries into the existing block.
#
#  Architecture (Option C — Lottie Expressions + JerryScript):
#
#    mic → i2s_audio → claude_audio_level (FFT 3-band)
#        → sensor on_value → claude_lottie.assign(layer, ix, var, val)
#        → thorvg LottieAnimation expression engine → orb reacts at ~30 Hz
#
#  Pre-requisites:
#
#    1. Copy the generated Lottie files to your SD card:
#         /sdcard/claude/claude_orb_idle.json
#         /sdcard/claude/claude_orb_listening.json
#         /sdcard/claude/claude_orb_thinking.json
#         /sdcard/claude/claude_orb_replying.json
#
#    2. You have a working i2s_audio + microphone + speaker + media_player.
#
#    3. CONFIG_THORVG_LOTTIE_EXPRESSIONS_SUPPORT=y is auto-enabled by the
#       claude_lottie_control component (adds ~1.5 MB JerryScript).
#
################################################################################


# ==============================================================================
# SECTION 1 — external_components
# ==============================================================================
# ADD these entries to your existing `external_components:` list.
# Do NOT create a second `external_components:` key.

#  - source:
#      type: local
#      path: components
#    components: [claude_audio_level, claude_lottie_control]
#    refresh: always


# ==============================================================================
# SECTION 2 — micro_wake_word (NEW block — waveshare (3).yaml does not have one)
# ==============================================================================

micro_wake_word:
  id: my_wake_word
  models:
    - ${micro_wake_word_model}
  on_wake_word_detected:
    then:
      - light.turn_on: backlight
      - voice_assistant.start:
          wake_word: !lambda return wake_word;


# ==============================================================================
# SECTION 3 — voice_assistant (NEW block — waveshare (3).yaml does not have one)
# ==============================================================================
# Complete voice_assistant configuration with Claude orb state management.
# The I2S bus is half-duplex (shared between mic 16 kHz and speaker 48 kHz),
# so on_end waits for announcements/media to finish before restarting the mic.

voice_assistant:
  microphone: esp32_microphone
  media_player: speaker_media_player
  micro_wake_word: my_wake_word
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  conversation_timeout: 300s

  on_client_connected:
    - globals.set:
        id: claude_state
        value: "0"
    - lvgl.widget.show: claude_orb_idle
    - lvgl.widget.hide: claude_orb_listening
    - lvgl.widget.hide: claude_orb_thinking
    - lvgl.widget.hide: claude_orb_replying
    - micro_wake_word.start:

  on_client_disconnected:
    - micro_wake_word.stop:

  on_listening:
    - globals.set:
        id: claude_state
        value: "1"
    - lvgl.page.show: claude_page
    - lvgl.widget.hide: claude_orb_idle
    - lvgl.widget.hide: claude_orb_thinking
    - lvgl.widget.hide: claude_orb_replying
    - lvgl.widget.show: claude_orb_listening
    # Zero out expression variables so the orb starts at rest
    - claude_lottie.assign:
        id: orb_ctl_listening
        layer: orb_reactive_core
        ix: 201
        var: bass
        val: 0.0
    - claude_lottie.assign:
        id: orb_ctl_listening
        layer: orb_reactive_glow
        ix: 202
        var: mid
        val: 0.0
    - claude_lottie.assign:
        id: orb_ctl_listening
        layer: orb_reactive_bloom
        ix: 203
        var: treble
        val: 0.0
    - lvgl.label.update:
        id: claude_status_label
        text: "À l'écoute..."
        text_color: 0xB6FFB0

  on_stt_vad_start:
    # User started speaking — give a visual kick to the core
    - claude_lottie.assign:
        id: orb_ctl_listening
        layer: orb_reactive_core
        ix: 201
        var: bass
        val: 0.8

  on_stt_end:
    - globals.set:
        id: claude_state
        value: "2"
    - lvgl.widget.hide: claude_orb_listening
    - lvgl.widget.show: claude_orb_thinking
    - lvgl.label.update:
        id: claude_status_label
        text: "Claude réfléchit..."
        text_color: 0xFFD6C2

  on_tts_start:
    - globals.set:
        id: claude_state
        value: "3"
    - lvgl.widget.hide: claude_orb_thinking
    - lvgl.widget.show: claude_orb_replying
    # Initialize expression variables for the replying orb
    - claude_lottie.assign:
        id: orb_ctl_replying
        layer: orb_reactive_core
        ix: 201
        var: bass
        val: 0.3
    - claude_lottie.assign:
        id: orb_ctl_replying
        layer: orb_reactive_glow
        ix: 202
        var: mid
        val: 0.3
    - claude_lottie.assign:
        id: orb_ctl_replying
        layer: orb_reactive_bloom
        ix: 203
        var: treble
        val: 0.2
    - lvgl.label.update:
        id: claude_status_label
        text: "Claude répond"
        text_color: 0xFFECB0

  on_end:
    - globals.set:
        id: claude_state
        value: "0"
    - lvgl.widget.hide: claude_orb_listening
    - lvgl.widget.hide: claude_orb_thinking
    - lvgl.widget.hide: claude_orb_replying
    - lvgl.widget.show: claude_orb_idle
    - lvgl.label.update:
        id: claude_status_label
        text: "Dis « OK Nabu »"
        text_color: 0x888892
    # Wait for I2S bus to be free before restarting the mic for wake word
    - wait_until:
        condition:
          media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        - not:
            media_player.is_announcing:
    - wait_until:
        - not:
            media_player.is_playing:
    - micro_wake_word.start:

  on_error:
    - globals.set:
        id: claude_state
        value: "4"
    - lvgl.widget.hide: claude_orb_listening
    - lvgl.widget.hide: claude_orb_thinking
    - lvgl.widget.hide: claude_orb_replying
    - lvgl.widget.show: claude_orb_idle
    - lvgl.label.update:
        id: claude_status_label
        text: "Erreur"
        text_color: 0xFF6666
    - delay: 3s
    - globals.set:
        id: claude_state
        value: "0"
    - lvgl.label.update:
        id: claude_status_label
        text: "Dis « OK Nabu »"
        text_color: 0x888892
    # Restart wake word after error recovery
    - micro_wake_word.start:


