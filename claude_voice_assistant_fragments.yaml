################################################################################
#  Claude Voice Assistant — YAML fragments to merge into your existing config
################################################################################
#
#  This file is NOT a standalone ESPHome config. It contains the sections you
#  need to add to your existing `waveshare (3).yaml` (or `p4mini.yaml`) to wire
#  up the Claude voice-assistant UI with:
#
#    - 4 Lottie orb animations (idle / listening / thinking / replying)
#    - Voice-reactive pulsing driven by the custom claude_audio_level component
#    - State transitions tied to voice_assistant pipeline triggers
#    - A pseudo-audio pulse during TTS playback (while Claude speaks)
#
#  Pre-requisites:
#
#    1. Copy the generated Lottie files to your SD card:
#         /sdcard/claude/claude_orb_idle.json
#         /sdcard/claude/claude_orb_listening.json
#         /sdcard/claude/claude_orb_thinking.json
#         /sdcard/claude/claude_orb_replying.json
#
#    2. Ensure your `external_components:` block includes the local components
#       directory so ESPHome picks up `claude_audio_level`:
#
#         external_components:
#           - source:
#               type: local
#               path: components
#             components: [claude_audio_level]
#             refresh: always
#
#    3. You already have a working voice_assistant + i2s microphone setup.
#       (If not, see p4mini.yaml for a reference.)
#
#  Then copy the sections below into your config, adapting IDs where noted.
#
################################################################################


# ===============================================================================
# SECTION 1 — Custom component declaration (external_components)
# ===============================================================================
# Add this entry to your existing `external_components:` list.

external_components:
  - source:
      type: local
      path: components
    components: [claude_audio_level]
    refresh: always


# ===============================================================================
# SECTION 2 — Audio level sensor
# ===============================================================================
# Taps into your existing microphone (esp32_microphone) and publishes a
# smoothed RMS value at ~30 Hz. The `on_value:` handler drives the Lottie
# widget's transform_scale so the orb grows/shrinks with your voice.
#
# NOTE: This assumes your mic ID is `esp32_microphone`. Adapt if different.

sensor:
  - platform: claude_audio_level
    id: claude_mic_level
    name: "Claude Mic Level"
    internal: true                 # hide from Home Assistant UI
    microphone: esp32_microphone
    update_interval: 33ms          # ~30 Hz, smooth enough for animation
    smoothing: 0.55                # 0 = no smoothing, 0.99 = very smooth
    scale: 4.0                     # amplify RMS (speech sits around 0.05–0.2)
    auto_start: true
    on_value:
      then:
        # Only react while the listening orb is visible; avoids fighting
        # the TTS pseudo-pulse during replying state.
        - if:
            condition:
              lambda: 'return id(claude_state) == 1;'  # 1 = listening
            then:
              - lvgl.widget.update:
                  id: claude_orb_listening
                  transform_scale: !lambda |-
                    // 256 = 1.0x in LVGL scale units (0.5 .. 1.8)
                    float s = 1.0f + x * 0.8f;
                    if (s > 1.8f) s = 1.8f;
                    if (s < 0.6f) s = 0.6f;
                    return (int)(s * 256);


# ===============================================================================
# SECTION 3 — State machine global
# ===============================================================================
# Simple integer global that tracks which orb should be visible. Used by
# Section 2's on_value handler to avoid racing with the TTS pulse.
#
#   0 = idle / not_ready    1 = listening
#   2 = thinking            3 = replying        4 = error

globals:
  - id: claude_state
    type: int
    restore_value: no
    initial_value: "0"


# ===============================================================================
# SECTION 4 — TTS pseudo-pulse interval
# ===============================================================================
# While Claude is speaking (replying state), the microphone can't be used
# for reactivity (it would feedback). Instead we drive the orb with a
# sinusoidal modulation that looks "alive" and syncs roughly to speech cadence.

interval:
  - interval: 40ms
    then:
      - if:
          condition:
            lambda: 'return id(claude_state) == 3;'  # replying
          then:
            - lvgl.widget.update:
                id: claude_orb_replying
                transform_scale: !lambda |-
                  // Two overlaid sines at speech-like frequencies
                  float t = millis() * 0.001f;
                  float a = sinf(t * 9.4f) * 0.15f;
                  float b = sinf(t * 14.1f) * 0.08f;
                  float s = 1.1f + a + b;
                  return (int)(s * 256);


# ===============================================================================
# SECTION 5 — Voice assistant triggers
# ===============================================================================
# MERGE these handlers into your existing `voice_assistant:` block. Do NOT
# duplicate the top-level `voice_assistant:` key — copy only the handler lines.
#
# Your existing on_end handler should be preserved and extended; the snippet
# below shows the full set for clarity.

voice_assistant:
  # ... keep your existing microphone / media_player / wake-word config ...

  on_client_connected:
    - globals.set: { id: claude_state, value: "0" }
    - lvgl.widget.show: claude_orb_idle
    - lvgl.widget.hide: [claude_orb_listening, claude_orb_thinking, claude_orb_replying, claude_orb_error]
    # ... your existing actions (e.g. micro_wake_word.start) ...

  on_listening:
    - globals.set: { id: claude_state, value: "1" }
    - lvgl.page.show: claude_page
    - lvgl.widget.hide: [claude_orb_idle, claude_orb_thinking, claude_orb_replying, claude_orb_error]
    - lvgl.widget.show: claude_orb_listening
    - lvgl.label.update:
        id: claude_status_label
        text: "À l'écoute..."
        text_color: 0xB6FFB0

  on_stt_vad_start:
    # User started actually speaking — give a visual kick
    - lvgl.widget.update:
        id: claude_orb_listening
        transform_scale: 307           # 1.2x bump

  on_stt_end:
    - globals.set: { id: claude_state, value: "2" }
    - lvgl.widget.hide: claude_orb_listening
    - lvgl.widget.show: claude_orb_thinking
    - lvgl.label.update:
        id: claude_status_label
        text: "Claude réfléchit..."
        text_color: 0xFFD6C2

  on_tts_start:
    - globals.set: { id: claude_state, value: "3" }
    - lvgl.widget.hide: claude_orb_thinking
    - lvgl.widget.show: claude_orb_replying
    - lvgl.label.update:
        id: claude_status_label
        text: "Claude répond"
        text_color: 0xFFECB0

  on_end:
    - globals.set: { id: claude_state, value: "0" }
    - lvgl.widget.hide: [claude_orb_listening, claude_orb_thinking, claude_orb_replying, claude_orb_error]
    - lvgl.widget.show: claude_orb_idle
    - lvgl.label.update:
        id: claude_status_label
        text: "Dis « OK Nabu »"
        text_color: 0x888892
    # ... your existing on_end actions (wait_until, micro_wake_word.start) ...

  on_error:
    - globals.set: { id: claude_state, value: "4" }
    - lvgl.widget.hide: [claude_orb_idle, claude_orb_listening, claude_orb_thinking, claude_orb_replying]
    - lvgl.widget.show: claude_orb_error
    - lvgl.label.update:
        id: claude_status_label
        text: "Erreur"
        text_color: 0xFF6666
    - delay: 2s
    - globals.set: { id: claude_state, value: "0" }
    - lvgl.widget.hide: claude_orb_error
    - lvgl.widget.show: claude_orb_idle


# ===============================================================================
# SECTION 6 — LVGL page with the 4 orbs
# ===============================================================================
# Add this page to your existing `lvgl: pages:` list. It renders all 4 orbs
# at the same center position, stacked, and hides/shows them based on state.
#
# The orbs load from the SD card at /sdcard/claude/*.json — make sure those
# files exist (see scripts/generate_claude_orbs.py in this repo).

lvgl:
  pages:
    - id: claude_page
      bg_color: 0x0A0810        # deep near-black violet, like the mockup
      widgets:

        # ----- Background decorative glow (optional, subtle) -----
        - obj:
            id: claude_bg_glow
            align: CENTER
            width: 900
            height: 900
            radius: 450
            bg_color: 0xD97757
            bg_opa: 12
            border_width: 0
            shadow_width: 80
            shadow_color: 0xD97757
            shadow_opa: 30

        # ----- 4 stacked Lottie orbs (only one visible at a time) -----
        - lottie:
            id: claude_orb_idle
            src: "/sdcard/claude/claude_orb_idle.json"
            loop: true
            auto_start: true
            align: CENTER
            y: -20
            width: 400
            height: 400

        - lottie:
            id: claude_orb_listening
            src: "/sdcard/claude/claude_orb_listening.json"
            loop: true
            auto_start: true
            hidden: true
            align: CENTER
            y: -20
            width: 400
            height: 400

        - lottie:
            id: claude_orb_thinking
            src: "/sdcard/claude/claude_orb_thinking.json"
            loop: true
            auto_start: true
            hidden: true
            align: CENTER
            y: -20
            width: 400
            height: 400

        - lottie:
            id: claude_orb_replying
            src: "/sdcard/claude/claude_orb_replying.json"
            loop: true
            auto_start: true
            hidden: true
            align: CENTER
            y: -20
            width: 400
            height: 400

        # Reuse the "replying" gold orb as the error indicator, tinted red
        # via a temporary LVGL style (or add a 5th Lottie if you prefer).
        - lottie:
            id: claude_orb_error
            src: "/sdcard/claude/claude_orb_replying.json"
            loop: true
            auto_start: true
            hidden: true
            align: CENTER
            y: -20
            width: 400
            height: 400

        # ----- Status text under the orb -----
        - label:
            id: claude_status_label
            text: "Dis « OK Nabu »"
            align: CENTER
            y: 220
            text_font: montserrat_20
            text_color: 0x888892

        # ----- Top bar: Claude branding + time -----
        - label:
            id: claude_brand_label
            text: "Claude · Sonnet 4.6"
            align: TOP_LEFT
            x: 24
            y: 20
            text_font: montserrat_16
            text_color: 0xD97757

        - label:
            id: claude_time_label
            text: "--:--"
            align: TOP_RIGHT
            x: -24
            y: 20
            text_font: montserrat_18
            text_color: 0xF5F5F7

        # ----- Bottom hint -----
        - label:
            id: claude_hint_label
            text: "Touche l'orbe pour interrompre"
            align: BOTTOM_MID
            y: -20
            text_font: montserrat_12
            text_color: 0x4A4A52


# ===============================================================================
# SECTION 7 — Keep the time label in sync (optional)
# ===============================================================================
# If you already have a `time:` component, add this handler to update the
# brand-bar clock every minute.

time:
  - platform: homeassistant
    id: claude_time
    on_time_sync:
      then:
        - lvgl.label.update:
            id: claude_time_label
            text: !lambda 'return id(claude_time).now().strftime("%H:%M");'
    on_time:
      - seconds: "0"
        minutes: "*"
        then:
          - lvgl.label.update:
              id: claude_time_label
              text: !lambda 'return id(claude_time).now().strftime("%H:%M");'


################################################################################
#  Done. Full reactivity chain:
#
#    mic -> i2s_audio -> claude_audio_level.cpp RMS -> sensor -> on_value
#        -> lvgl.widget.update transform_scale -> orb pulses at ~30 Hz
#
#  State machine (driven by voice_assistant triggers + claude_state global):
#
#    idle  -(on_listening)->  listening  -(on_stt_end)->  thinking
#          <-(on_end)- replying  <-(on_tts_start)-  thinking
#          <-(on_error)-  error  ->  idle (after 2s)
#
################################################################################
