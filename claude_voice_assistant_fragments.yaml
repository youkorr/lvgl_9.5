################################################################################
#  State machine (driven by voice_assistant triggers + claude_state global):
#
#    0 = idle / not_ready
#    1 = listening        (FFT sensors → orb_ctl_listening)
#    2 = thinking
#    3 = replying         (sinusoidal pseudo-pulse → orb_ctl_replying)
#    4 = error            (idle orb + red status label, auto-recover 3s)
#
#    idle ──(on_listening)──► listening ──(on_stt_end)──► thinking
#      ▲                                                     │
#      │                                              (on_tts_start)
#      │                                                     ▼
#      └────(on_end)────── replying ◄────────────────────────┘
#      └────(on_error)──── error ──(3s)──► idle
#
#  Reactivity chain:
#
#    mic → i2s_audio → claude_audio_level (FFT 256-pt, Hann window)
#        → 3 band sensors (bass / mid / treble) → on_value
#        → claude_lottie.assign(layer, ix, var, val)
#        → thorvg LottieAnimation::assign() → JerryScript expression eval
#        → orb reactive layers scale/opacity at ~30 Hz
#
#  Expression variables embedded in the orb JSON files:
#    orb_reactive_core   s: var bass   → scale = 100 + bass*60
#    orb_reactive_glow   o: var mid    → opacity = 60 + mid*40
#    orb_reactive_bloom  s: var treble → scale = 95 + treble*25
#
#  Memory budget for 4 Lottie orbs @ 400×400:
#    4 × 400 × 400 × 4 bytes (ARGB8888) = 2.56 MB PSRAM
#    (ESP32-P4 has 32 MB PSRAM → ~8% usage for orbs alone)
#
################################################################################
