################################################################################
#  Claude Voice Assistant — fragments prêts à copier dans waveshare (3).yaml
################################################################################
#
#  INSTRUCTIONS : copie chaque bloc ci-dessous dans la section correspondante
#  de ton waveshare (3).yaml. Ne duplique PAS les clés de premier niveau :
#  fusionne les entrées dans les blocs existants.
#
#  Ordre de priorité pour l'intégration :
#    1. external_components    (ajouter les composants claude_*)
#    2. globals                (ajouter claude_state)
#    3. speaker                (ajouter mp4_resampling_speaker si besoin)
#    4. micro_wake_word        (bloc entier — waveshare ne l'a pas)
#    5. voice_assistant        (bloc entier — waveshare ne l'a pas)
#    6. claude_lottie_control  (bloc entier — nouveau)
#    7. sensor                 (ajouter les 3 sensors FFT)
#    8. interval               (ajouter le pseudo-pulse TTS)
#    9. lvgl.pages             (ajouter la page claude_page)
#
################################################################################


