# ==============================================================================
# BLOC 4 — micro_wake_word (BLOC ENTIER NOUVEAU à la racine du yaml)
# ==============================================================================

micro_wake_word:
  id: my_wake_word
  models:
    - ${micro_wake_word_model}
  on_wake_word_detected:
    then:
      - light.turn_on: backlight
      - voice_assistant.start:
          wake_word: !lambda return wake_word;


# ==============================================================================
# BLOC 5 — voice_assistant (BLOC ENTIER NOUVEAU à la racine du yaml)
# ==============================================================================

voice_assistant:
  microphone: esp32_microphone
  media_player: speaker_media_player
  micro_wake_word: my_wake_word
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  conversation_timeout: 300s

  on_client_connected:
    - globals.set:
        id: claude_state
        value: "0"
    - lvgl.widget.show: claude_orb_idle
    - lvgl.widget.hide: claude_orb_listening
    - lvgl.widget.hide: claude_orb_thinking
    - lvgl.widget.hide: claude_orb_replying
    - micro_wake_word.start:

  on_client_disconnected:
    - micro_wake_word.stop:

  on_listening:
    - globals.set:
        id: claude_state
        value: "1"
    - lvgl.page.show: claude_page
    - lvgl.widget.hide: claude_orb_idle
    - lvgl.widget.hide: claude_orb_thinking
    - lvgl.widget.hide: claude_orb_replying
    - lvgl.widget.show: claude_orb_listening
    - claude_lottie.assign:
        id: orb_ctl_listening
        layer: orb_reactive_core
        ix: 201
        var: bass
        val: 0.0
    - claude_lottie.assign:
        id: orb_ctl_listening
        layer: orb_reactive_glow
        ix: 202
        var: mid
        val: 0.0
    - claude_lottie.assign:
        id: orb_ctl_listening
        layer: orb_reactive_bloom
        ix: 203
        var: treble
        val: 0.0
    - lvgl.label.update:
        id: claude_status_label
        text: "À l'écoute..."
        text_color: 0xB6FFB0

  on_stt_vad_start:
    - claude_lottie.assign:
        id: orb_ctl_listening
        layer: orb_reactive_core
        ix: 201
        var: bass
        val: 0.8

  on_stt_end:
    - globals.set:
        id: claude_state
        value: "2"
    - lvgl.widget.hide: claude_orb_listening
    - lvgl.widget.show: claude_orb_thinking
    - lvgl.label.update:
        id: claude_status_label
        text: "Claude réfléchit..."
        text_color: 0xFFD6C2

  on_tts_start:
    - globals.set:
        id: claude_state
        value: "3"
    - lvgl.widget.hide: claude_orb_thinking
    - lvgl.widget.show: claude_orb_replying
    - claude_lottie.assign:
        id: orb_ctl_replying
        layer: orb_reactive_core
        ix: 201
        var: bass
        val: 0.3
    - claude_lottie.assign:
        id: orb_ctl_replying
        layer: orb_reactive_glow
        ix: 202
        var: mid
        val: 0.3
    - claude_lottie.assign:
        id: orb_ctl_replying
        layer: orb_reactive_bloom
        ix: 203
        var: treble
        val: 0.2
    - lvgl.label.update:
        id: claude_status_label
        text: "Claude répond"
        text_color: 0xFFECB0

  on_end:
    - globals.set:
        id: claude_state
        value: "0"
    - lvgl.widget.hide: claude_orb_listening
    - lvgl.widget.hide: claude_orb_thinking
    - lvgl.widget.hide: claude_orb_replying
    - lvgl.widget.show: claude_orb_idle
    - lvgl.label.update:
        id: claude_status_label
        text: "Dis « OK Nabu »"
        text_color: 0x888892
    - wait_until:
        condition:
          media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        - not:
            media_player.is_announcing:
    - wait_until:
        - not:
            media_player.is_playing:
    - micro_wake_word.start:

  on_error:
    - globals.set:
        id: claude_state
        value: "4"
    - lvgl.widget.hide: claude_orb_listening
    - lvgl.widget.hide: claude_orb_thinking
    - lvgl.widget.hide: claude_orb_replying
    - lvgl.widget.show: claude_orb_idle
    - lvgl.label.update:
        id: claude_status_label
        text: "Erreur"
        text_color: 0xFF6666
    - delay: 3s
    - globals.set:
        id: claude_state
        value: "0"
    - lvgl.label.update:
        id: claude_status_label
        text: "Dis « OK Nabu »"
        text_color: 0x888892
    - micro_wake_word.start:


# ==============================================================================
# BLOC 6 — claude_lottie_control (BLOC ENTIER NOUVEAU à la racine du yaml)
# ==============================================================================

claude_lottie_control:
  - id: orb_ctl_listening
    lottie_id: claude_orb_listening

  - id: orb_ctl_replying
    lottie_id: claude_orb_replying


