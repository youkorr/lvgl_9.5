#  Résumé visuel de l'état :
#
#    claude_state = 0  → idle          (claude_orb_idle visible)
#    claude_state = 1  → listening     (claude_orb_listening + FFT réactif)
#    claude_state = 2  → thinking      (claude_orb_thinking, anim keyframe)
#    claude_state = 3  → replying      (claude_orb_replying + pulse sinus)
#    claude_state = 4  → error         (idle orb + label rouge 3s)
#
#  Fichiers à copier sur la carte SD :
#    /sdcard/claude/claude_orb_idle.json
#    /sdcard/claude/claude_orb_listening.json
#    /sdcard/claude/claude_orb_thinking.json
#    /sdcard/claude/claude_orb_replying.json
