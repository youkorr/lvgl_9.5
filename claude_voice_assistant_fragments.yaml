# ==============================================================================
# SECTION 5 — claude_lottie_control
# ==============================================================================
# NEW top-level block. One instance per lottie widget that needs runtime
# expression variable updates.

claude_lottie_control:
  - id: orb_ctl_listening
    lottie_id: claude_orb_listening

  - id: orb_ctl_replying
    lottie_id: claude_orb_replying


