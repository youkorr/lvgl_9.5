# =============================================================================
# Jarvis-style 3D PARTICLE CLOUD sphere — reacts to Voice Assistant states.
# Target: Waveshare ESP32-P4-WIFI6-TOUCH-LCD-7B (MIPI-DSI 1024x600, rotation 180)
#
# State → visual mapping:
#   idle              : dim blue,   slow breath           (0.05 amp, 0.4 Hz)
#   listening         : cyan,       live mic RMS          (auto_pulse off)
#   thinking (STT/intent): violet,  mid breath            (0.35 amp, 2.0 Hz)
#   replying (TTS)    : warm green, fast breath           (0.55 amp, 4.0 Hz)
#   error             : red,        fast                  (0.70 amp, 6.0 Hz)
# =============================================================================
esphome:
  name: sphere-particles
  friendly_name: Sphere Particles
  min_version: 2025.2.0
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    priority: -100
    then:
      # Start mic RMS feed. Only actually animates the sphere while listening
      # (during other states auto_pulse drives the visual).
      - lambda: |-
          id(esp32_microphone)->add_data_callback([](const std::vector<uint8_t> &data) {
            const int16_t *s = reinterpret_cast<const int16_t *>(data.data());
            size_t n = data.size() / 2;
            if (n == 0) return;
            uint64_t acc = 0;
            for (size_t i = 0; i < n; i++) {
              int32_t v = s[i];
              acc += (uint32_t)(v * v);
            }
            float rms = sqrtf((float) acc / (float) n) / 32768.0f;
            if (rms < 0.015f) rms = 0.0f;
            float shaped = sqrtf(rms) * 1.6f;
            if (shaped > 1.0f) shaped = 1.0f;
            id(voice_orb).set_level(shaped);
          });
      # Start in idle look
      - lambda: |-
          id(voice_orb).set_color_target(0x224466);
          id(voice_orb).set_auto_pulse(0.05, 0.4);

esp32:
  board: esp32-p4-evboard
  flash_size: 16MB
  framework:
    type: esp-idf
    version: 5.5.2
    platform_version: 55.03.35
    advanced:
      enable_idf_experimental_features: yes
    sdkconfig_options:
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_SPEED_200M: "y"
      CONFIG_SPIRAM_SPEED: "200"
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      CONFIG_ESP_TIMER_TASK_STACK_SIZE: "4096"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"

psram:
  speed: 200MHz

esp_ldo:
  - voltage: 2.5V
    channel: 3
  - voltage: 2.5V
    channel: 4

logger:
  level: INFO

# Required for voice_assistant
api:
  encryption:
    key: ""
ota:
  - platform: esphome
    password: ""
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Sphere Fallback"
    password: ""

external_components:
  - source:
      type: git
      url: https://github.com/youkorr/lvgl_9.5
      ref: claude/create-sphere-BVofQ
    components: [lvgl, image, thorvg, sphere_viz]
    refresh: 0s

# ----------------------------------------------------------------------------
# I2C (audio codecs)
# ----------------------------------------------------------------------------
i2c:
  - id: bsp_bus
    sda: GPIO07
    scl: GPIO08
    frequency: 400kHz

# ----------------------------------------------------------------------------
# I2S audio + mic + speaker
# ----------------------------------------------------------------------------
i2s_audio:
  - id: audio_bus
    i2s_mclk_pin: GPIO13
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bsp_bus
    address: 0x18

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bsp_bus
    address: 0x40

microphone:
  - platform: i2s_audio
    id: esp32_microphone
    i2s_audio_id: audio_bus
    i2s_din_pin: GPIO11
    sample_rate: 16000
    bits_per_sample: 16bit
    adc_type: external

speaker:
  - platform: i2s_audio
    id: esp32_speaker
    i2s_audio_id: audio_bus
    i2s_dout_pin: GPIO9
    audio_dac: es8311_dac
    dac_type: external
    channel: mono
    buffer_duration: 100ms   # reduced from 500ms to free internal DRAM (i2s DMA)
    bits_per_sample: 16bit
    sample_rate: 48000

  - platform: mixer
    id: mixing_speaker
    output_speaker: esp32_speaker
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

media_player:
  - platform: speaker
    name: "ESP32 P4 Media Player"
    id: speaker_media_player
    codec_support_enabled: true
    volume_min: 0.5
    volume_max: 0.75
    volume_increment: 0.05
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      num_channels: 1
      sample_rate: 48000

# ----------------------------------------------------------------------------
# Wake word + voice assistant
# ----------------------------------------------------------------------------
micro_wake_word:
  id: my_wake_word
  models:
    - model: alexa
  on_wake_word_detected:
    - lvgl.page.show: orb_page
    - component.update: main_display
    - lambda: |-
        // Wake-word flash: bright cyan ping
        id(voice_orb).set_color_target(0x00FFFF);
        id(voice_orb).set_auto_pulse(0.8, 5.0);
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  microphone: esp32_microphone
  media_player: speaker_media_player
  micro_wake_word: my_wake_word
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  conversation_timeout: 300s

  on_start:
    - lvgl.page.show: orb_page
    - component.update: main_display

  # --- Listening: mic-reactive cyan, disable synthetic ---
  on_listening:
    - lvgl.page.show: orb_page
    - component.update: main_display
    - lambda: |-
        id(voice_orb).set_color_target(0x00E5FF);
        id(voice_orb).set_auto_pulse(0.0, 0.0);

  # --- Thinking (intent processing): violet, strong pulsing scatter ---
  on_stt_end:
    - lvgl.page.show: orb_page
    - component.update: main_display
    - lambda: |-
        id(voice_orb).set_color_target(0xAA55FF);
        id(voice_orb).set_auto_pulse(0.75, 2.5);

  # --- Replying (TTS playing): warm green, full explosive scatter ---
  on_tts_start:
    - lvgl.page.show: orb_page
    - component.update: main_display
    - lambda: |-
        id(voice_orb).set_color_target(0x33FFAA);
        id(voice_orb).set_auto_pulse(0.95, 4.5);

  on_tts_end:
    - lvgl.page.show: orb_page
    - component.update: main_display

  # --- End of flow → idle dim blue slow breath ---
  on_end:
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        - and:
            - not:
                media_player.is_announcing:
            - not:
                media_player.is_playing:
    - lvgl.page.show: orb_page
    - component.update: main_display
    - lambda: |-
        id(voice_orb).set_color_target(0x224466);
        id(voice_orb).set_auto_pulse(0.05, 0.4);
    - micro_wake_word.start:

  on_error:
    - lvgl.page.show: orb_page
    - component.update: main_display
    - lambda: |-
        id(voice_orb).set_color_target(0xFF3030);
        id(voice_orb).set_auto_pulse(0.70, 6.0);

  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - micro_wake_word.stop:

# ----------------------------------------------------------------------------
# Display
# ----------------------------------------------------------------------------
display:
  - platform: mipi_dsi
    id: main_display
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B
    reset_pin:
      number: 33
    rotation: 180
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 1024
      height: 600

# ----------------------------------------------------------------------------
# LVGL
# ----------------------------------------------------------------------------
lvgl:
  buffer_size: 25%          # reduced from 100% to free internal DRAM for i2s DMA
  byte_order: little_endian
  ppa_enabled: true
  displays:
    - main_display
  pages:
    - id: orb_page
      bg_color: 0x000000
      widgets:
        - label:
            id: title_label
            text: "JARVIS"
            text_color: 0x66AAFF
            align: TOP_MID
            y: 20
        - label:
            id: state_label
            text: "say 'Alexa'"
            text_color: 0x404040
            align: BOTTOM_MID
            y: -20

# ----------------------------------------------------------------------------
# Voice-reactive 3D particle sphere. page_id ties the canvas to orb_page so
# it renders when that page is shown.
# ----------------------------------------------------------------------------
sphere_viz:
  - id: voice_orb
    page_id: orb_page
    x: 312
    y: 100
    width: 400
    height: 400
    mode: PARTICLES
    fps: 30
    color: 0x224466
    particles: 900
