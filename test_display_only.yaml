substitutions:
  name: test-display-only
  friendly_name: Test Display Only

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.2.0
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

logger:
  level: DEBUG

api:
  encryption:
    key: ""

ota:
  - platform: esphome
    password: ""

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Test-Display Fallback"
    password: ""

captive_portal:

psram:
  mode: octal
  speed: 80MHz

output:
  - platform: ledc
    pin: GPIO47
    id: backlight_output

light:
  - platform: monochromatic
    id: led
    name: LCD Backlight
    entity_category: config
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

spi:
  clk_pin: 7
  mosi_pin: 6

display:
  - platform: ili9xxx
    id: my_display
    model: S3BOX
    data_rate: 40MHz
    cs_pin: 5
    dc_pin: 4
    reset_pin:
      number: 48
      inverted: true
    invert_colors: false
    lambda: |-
      // Red rectangle - top
      it.filled_rectangle(0, 0, 320, 80, Color(255, 0, 0));
      // Green rectangle - middle
      it.filled_rectangle(0, 80, 320, 80, Color(0, 255, 0));
      // Blue rectangle - bottom
      it.filled_rectangle(0, 160, 320, 80, Color(0, 0, 255));
      // White text
      it.printf(160, 120, id(my_font), Color(255, 255, 255), TextAlign::CENTER, "Display OK!");

font:
  - file: "gfonts://Roboto"
    id: my_font
    size: 30
